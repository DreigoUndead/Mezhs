name: chatgpt-rate-limit-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply ChatGPT poll rate-limit fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch provider and regression test
        shell: bash
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Validate provider change
        shell: bash
        run: |
          node --test tests/chatgpt-native-request.test.js
          node --test tests/browser-provider-operations.test.js
          dotnet build integrations/Mezhs.Integrations.ChatGpt/Mezhs.Integrations.ChatGpt.csproj -c Release
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/Mezhs.Integrations.ChatGpt/browser/chatgpt.ts tests/chatgpt-native-request.test.js
          git commit -m "Back off ChatGPT conversation polling"
          git push
