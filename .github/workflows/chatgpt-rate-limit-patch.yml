name: chatgpt-rate-limit-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply ChatGPT poll rate-limit fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch provider and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('integrations/Mezhs.Integrations.ChatGpt/browser/chatgpt.ts')
          source = source_path.read_text(encoding='utf-8')

          marker = '});\n\nmodule.exports = {'
          replacement = '''});

const CONVERSATION_POLL_INTERVAL_MS = 2000;
const CONVERSATION_POLL_ATTEMPTS = 120;
const CONVERSATION_RATE_LIMIT_MAX_FALLBACK_MS = 30000;

module.exports = {'''
          if marker not in source:
              raise SystemExit('Could not find ChatGPT module constants insertion point.')
          source = source.replace(marker, replacement, 1)

          old_error = '''  error.status = response.status;
  error.endpoint = endpoint;
  error.detail = detail;
  throw error;
}

function isConversationUnavailable(error, conversationId) {'''
          new_error = '''  error.status = response.status;
  error.endpoint = endpoint;
  error.detail = detail;
  error.retryAfterMs = parseRetryAfterMs(response.headers.get("retry-after"));
  throw error;
}

function parseRetryAfterMs(value) {
  if (!value) return null;
  const seconds = Number(value);
  if (Number.isFinite(seconds) && seconds >= 0)
    return Math.ceil(seconds * 1000);
  const date = Date.parse(value);
  return Number.isNaN(date) ? null : Math.max(0, date - Date.now());
}

function isConversationUnavailable(error, conversationId) {'''
          if old_error not in source:
              raise SystemExit('Could not find ChatGPT API error block.')
          source = source.replace(old_error, new_error, 1)

