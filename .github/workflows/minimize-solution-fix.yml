name: Minimize solution fix

on:
  push:
    branches:
      - whatsapp-cli-foundation

permissions:
  contents: write

jobs:
  minimize-and-validate:
    runs-on: windows-latest
    env:
      MEZHS_EXECUTION_ID: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-cli-foundation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Rebuild minimal solution diff
        shell: pwsh
        run: |
          git fetch origin main
          python tools/temp-minimize-solution.py
      - name: Build full solution
        run: dotnet build Mezhs.sln
      - name: Validate WhatsApp
        run: |
          dotnet run --project src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj --no-build -- Validate
          dotnet run --project src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj --no-build -- Test
      - name: Commit minimal solution fix and remove temporary files
        shell: pwsh
        run: |
          Remove-Item .github/workflows/minimize-solution-fix.yml
          Remove-Item tools/temp-minimize-solution.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mezhs.sln .github/workflows/minimize-solution-fix.yml tools/temp-minimize-solution.py
          git commit -m "Minimize solution project additions"
          git push origin HEAD:whatsapp-cli-foundation
