name: Agent provider validation

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply ChatGPT native-send lifetime repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'integrations/Mezhs.Integrations.ChatGpt/browser/chatgpt.ts'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $oldTimer = @'
            const timeout = setTimeout(
              () => rejectRequest(new Error("ChatGPT native send request was not observed.")),
              60000
            );

          '@.Replace("`r`n", "`n")
          if ($text.Contains($oldTimer)) {
            $text = $text.Replace($oldTimer, '')
          }

          $oldWait = @'
              await trigger();
              return await request;
            } finally {
              clearTimeout(timeout);
              debuggerClient.removeListener("message", onMessage);
          '@.Replace("`r`n", "`n")
          $newWait = @'
              await trigger();
              const timeout = setTimeout(
                () => rejectRequest(new Error("ChatGPT native send request was not observed.")),
                60000
              );
              try {
                return await request;
              } finally {
                clearTimeout(timeout);
              }
            } finally {
              debuggerClient.removeListener("message", onMessage);
          '@.Replace("`r`n", "`n")

          if ($text.Contains($oldWait)) {
            $text = $text.Replace($oldWait, $newWait)
          }
          elseif (-not $text.Contains($newWait)) {
            throw 'Could not locate the ChatGPT native-send observation block to repair.'
          }

          [System.IO.File]::WriteAllText($path, $text)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix ChatGPT native send observation lifetime [skip ci]'
            git push origin HEAD:agent-api-composition
          }

      - name: Run validation and record result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $resultPath = 'agent-provider-validation.txt'
          Remove-Item -LiteralPath $resultPath -Force -ErrorAction SilentlyContinue
          $failed = $false

          function Run-Check {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$File,
              [Parameter(Mandatory = $true)][string[]]$Arguments
            )

            "=== $Name ===" | Add-Content -LiteralPath $resultPath
            $output = & $File @Arguments 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { $_.ToString() } | Add-Content -LiteralPath $resultPath
            "EXIT: $exitCode" | Add-Content -LiteralPath $resultPath
            "" | Add-Content -LiteralPath $resultPath
            if ($exitCode -ne 0) { $script:failed = $true }
          }

          Run-Check 'dotnet build' 'dotnet' @('build', 'Mezhs.sln', '-c', 'Release')
          Run-Check 'ChatGPT native request tests' 'node' @('--test', 'tests/chatgpt-native-request.test.js', 'tests/chatgpt-native-send-lifetime.test.js', 'tests/chatgpt-conversation-unavailable.test.js')
          Run-Check 'Agent provider lifetime checks' 'pwsh' @('-NoProfile', '-File', 'tests/agent-provider-lifetime.ps1')
          Run-Check 'Agent architecture checks' 'pwsh' @('-NoProfile', '-File', 'tests/agent-architecture.ps1')
          Run-Check 'Agent runtime resilience' 'pwsh' @('-NoProfile', '-File', 'tests/agent-runtime-resilience.ps1')
          Run-Check 'Agent cancellation recovery' 'pwsh' @('-NoProfile', '-File', 'tests/agent-cancel-recovery.ps1')
          Run-Check 'API smoke' 'pwsh' @('-NoProfile', '-File', 'tests/api-smoke.ps1')
          Run-Check 'Agent API smoke' 'pwsh' @('-NoProfile', '-File', 'tests/agent-api-smoke.ps1')

          $overall = if ($failed) { 'FAIL' } else { 'PASS' }
          "OVERALL: $overall" | Add-Content -LiteralPath $resultPath

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $resultPath
          git commit -m 'Record temporary Agent provider validation [skip ci]'
          git push origin HEAD:agent-api-composition

          if ($failed) { exit 1 }
