name: Normalize Log foundation integration

on:
  push:
    branches: [executor-foundation]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep solution diff minimal
        shell: pwsh
        run: |
          $base = 'd8e313adefa9c089f7628c9ec4ded5e9d0587019'
          $solution = git show "$base`:Mezhs.sln" | Out-String
          $projectBlocks = @'
          Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "Mezhs.Log.Shared", "src\Mezhs.Log.Shared\Mezhs.Log.Shared.csproj", "{8D12F19D-2271-4A4A-9EEB-68060D744225}"
          EndProject
          Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "Mezhs.Log.Data", "src\Mezhs.Log.Data\Mezhs.Log.Data.csproj", "{E63E0A38-B354-43DD-9B30-34857E34E2FD}"
          EndProject
          Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "Mezhs.Log.Sql", "src\Mezhs.Log.Sql\Mezhs.Log.Sql.csproj", "{9ECCDCA4-2153-44D1-980A-4009CFDC4DB3}"
          EndProject
          '@
          $solution = $solution -replace '(?m)^Global\r?$', ($projectBlocks.TrimEnd() + "`r`nGlobal")

          $configs = @'
          		{8D12F19D-2271-4A4A-9EEB-68060D744225}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
          		{8D12F19D-2271-4A4A-9EEB-68060D744225}.Debug|Any CPU.Build.0 = Debug|Any CPU
          		{8D12F19D-2271-4A4A-9EEB-68060D744225}.Release|Any CPU.ActiveCfg = Release|Any CPU
          		{8D12F19D-2271-4A4A-9EEB-68060D744225}.Release|Any CPU.Build.0 = Release|Any CPU
          		{E63E0A38-B354-43DD-9B30-34857E34E2FD}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
          		{E63E0A38-B354-43DD-9B30-34857E34E2FD}.Debug|Any CPU.Build.0 = Debug|Any CPU
          		{E63E0A38-B354-43DD-9B30-34857E34E2FD}.Release|Any CPU.ActiveCfg = Release|Any CPU
          		{E63E0A38-B354-43DD-9B30-34857E34E2FD}.Release|Any CPU.Build.0 = Release|Any CPU
          		{9ECCDCA4-2153-44D1-980A-4009CFDC4DB3}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
          		{9ECCDCA4-2153-44D1-980A-4009CFDC4DB3}.Debug|Any CPU.Build.0 = Debug|Any CPU
          		{9ECCDCA4-2153-44D1-980A-4009CFDC4DB3}.Release|Any CPU.ActiveCfg = Release|Any CPU
          		{9ECCDCA4-2153-44D1-980A-4009CFDC4DB3}.Release|Any CPU.Build.0 = Release|Any CPU
          '@
          $pattern = '(?s)(\tGlobalSection\(ProjectConfigurationPlatforms\) = postSolution\r?\n)(.*?)(\tEndGlobalSection)'
          $match = [regex]::Match($solution, $pattern)
          if (-not $match.Success) { throw 'ProjectConfigurationPlatforms section not found.' }
          $body = $match.Groups[2].Value.TrimEnd("`r", "`n")
          $replacement = $match.Groups[1].Value + $body + "`r`n" + $configs.TrimEnd() + "`r`n" + $match.Groups[3].Value
          $solution = $solution.Substring(0, $match.Index) + $replacement + $solution.Substring($match.Index + $match.Length)
          [IO.File]::WriteAllText((Join-Path $PWD 'Mezhs.sln'), $solution, [Text.UTF8Encoding]::new($false))

          git diff --check -- Mezhs.sln
          $added = (git diff --numstat -- Mezhs.sln).Split("`t")[0]
          if ([int]$added -gt 30) { throw "Solution integration is unexpectedly large: $added added lines." }

      - name: Commit minimal solution integration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mezhs.sln
          git commit -m 'Keep Log projects in solution without CLI churn [skip ci]'
          git push
