name: Integrate Log foundation mechanics

on:
  push:
    branches: [executor-foundation]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Route Executor store through LogSql and add Log projects
        shell: pwsh
        run: |
          $path = 'src/Mezhs.Executor/ExecutorStore.cs'
          $text = Get-Content -LiteralPath $path -Raw

          $rules = @(
            @{ Pattern = 'using Mezhs\.Sqlite;'; Replacement = 'using Mezhs.Log.Sql;' },
            @{ Pattern = '    private readonly SqliteDatabase _database;'; Replacement = "    private readonly LogSql _log = new();`r`n    private readonly string _file;" },
            @{ Pattern = '        _database = new SqliteDatabase\(path\);\r?\n        _database\.Initialize\("""'; Replacement = "        _file = System.IO.Path.GetFullPath(path);`r`n        _log.Execute(_file, `"`"`"" },
            @{ Pattern = '    public string Path => _database\.Path;'; Replacement = '    public string Path => _file;' },
            @{ Pattern = '_database\.Open\(\)'; Replacement = '_log.Open(_file)' }
          )
          foreach ($rule in $rules) {
            if ($text -notmatch $rule.Pattern) { throw "Expected ExecutorStore pattern not found: $($rule.Pattern)" }
            $text = [regex]::Replace($text, $rule.Pattern, $rule.Replacement)
          }
          Set-Content -LiteralPath $path -Value $text -Encoding UTF8

          dotnet sln Mezhs.sln add `
            src/Mezhs.Log.Shared/Mezhs.Log.Shared.csproj `
            src/Mezhs.Log.Data/Mezhs.Log.Data.csproj `
            src/Mezhs.Log.Sql/Mezhs.Log.Sql.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet sln add failed.' }

      - name: Commit integration rewrite
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Mezhs.Executor/ExecutorStore.cs Mezhs.sln
          git diff --cached --check
          git commit -m 'Complete Log foundation merge [skip ci]'
          git push
