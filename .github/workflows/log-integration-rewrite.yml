name: Validate Log foundation integration

on:
  push:
    branches: [executor-foundation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update architecture guard for LogSql ownership
        shell: pwsh
        run: |
          $path = 'tests/agent-architecture.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $needle = '$executorService = Read "src/Mezhs.Executor/ExecutorService.cs"'
          $replacement = @'
          $executorService = Read "src/Mezhs.Executor/ExecutorService.cs"
          $executorProject = Read "src/Mezhs.Executor/Mezhs.Executor.csproj"
          $logSqlProject = Read "src/Mezhs.Log.Sql/Mezhs.Log.Sql.csproj"
          $logSql = Read "src/Mezhs.Log.Sql/LogSql.cs"
          $solution = Read "Mezhs.sln"
          '@.Trim()
          if (-not $text.Contains($needle)) { throw 'Executor service architecture marker not found.' }
          $text = $text.Replace($needle, $replacement)

          $old = 'Assert ($executorStore -match ''SqliteDatabase _database'' -and $executorStore -notmatch ''new SqliteConnectionStringBuilder'') "ExecutorStore bypasses the shared SQLite foundation."'
          $new = @'
          Assert ($executorProject -match 'Mezhs.Log.Sql' -and $executorProject -notmatch 'Mezhs.Sqlite') "Executor does not depend on LogSql as its persistence boundary."
          Assert ($logSqlProject -match 'Mezhs.Sqlite' -and $logSql -match 'new SqliteDatabase\(_resolve\(file\)\)\.Open\(\)' -and $logSql -notmatch 'SqliteConnectionStringBuilder|journal_mode|busy_timeout') "LogSql bypasses or duplicates the shared SQLite connection foundation."
          Assert ($executorStore -match 'LogSql _log' -and $executorStore -match '_log\.Open\(_file\)' -and $executorStore -notmatch 'SqliteDatabase|new SqliteConnectionStringBuilder') "ExecutorStore bypasses LogSql for SQLite access."
          Assert ($solution -match 'Mezhs.Log.Shared' -and $solution -match 'Mezhs.Log.Data' -and $solution -match 'Mezhs.Log.Sql') "Log foundation projects are missing from the solution."
          '@.Trim()
          if (-not $text.Contains($old)) { throw 'Old Executor SQLite architecture assertion not found.' }
          $text = $text.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $text -Encoding UTF8

      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release --nologo
      - name: Console regression suite
        shell: pwsh
        run: dotnet run --project tests/Mezhs.Console.TestApp/Mezhs.Console.TestApp.csproj -c Release -- Test
      - name: LogData self-test
        shell: pwsh
        run: dotnet run --project src/Mezhs.Log.Data/Mezhs.Log.Data.csproj -c Release -- Test
      - name: LogSql self-test
        shell: pwsh
        run: dotnet run --project src/Mezhs.Log.Sql/Mezhs.Log.Sql.csproj -c Release -- Test
      - name: Agent architecture
        shell: pwsh
        run: pwsh -File tests/agent-architecture.ps1
      - name: Policy decoder
        shell: pwsh
        run: pwsh -File tests/policy-decoder.ps1
      - name: Executor lifecycle
        shell: pwsh
        run: pwsh -File tests/executor-lifecycle.ps1
      - name: Executor self-restart
        shell: pwsh
        run: pwsh -File tests/executor-self-restart.ps1
      - name: Agent API smoke
        shell: pwsh
        run: pwsh -File tests/agent-api-smoke.ps1
      - name: Executor-backed policy evidence
        shell: pwsh
        run: pwsh -File tests/agent-executor-evidence.ps1
      - name: Pending cancellation recovery
        shell: pwsh
        run: pwsh -File tests/agent-cancel-recovery.ps1
      - name: Agent restart resilience
        shell: pwsh
        run: pwsh -File tests/agent-runtime-resilience.ps1

      - name: Commit guard and remove temporary workflow
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/log-integration-rewrite.yml
          git add tests/agent-architecture.ps1
          git diff --cached --check
          git commit -m 'Validate LogSql Executor integration [skip ci]'
          git push
