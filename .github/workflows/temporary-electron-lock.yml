name: Refresh Electron dependency lock
on:
  push:
    branches: [review/chat-rich-formatting]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate legacy lockfile
        run: npm install --prefix electron --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Electron dependency lock [skip ci]"
            git push origin HEAD:review/chat-rich-formatting
          fi
