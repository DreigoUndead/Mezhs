name: Validate log foundation

on:
  push:
    branches:
      - log-foundation

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release
      - name: Console regression tests
        run: dotnet run --project tests/Mezhs.Console.TestApp -c Release -- Test
      - name: LogData regression tests
        run: dotnet run --project src/Mezhs.Log.Data -c Release -- Test
      - name: LogSql regression tests
        run: dotnet run --project src/Mezhs.Log.Sql -c Release -- Test
