name: MEŽS Core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mezhs-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows Agent and integrations
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install provider response converter
        shell: pwsh
        run: |
          npm install --prefix electron --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/provider-response-normalization.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: JavaScript syntax and provider regression tests
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem integrations/Mezhs.Integrations.ChatGpt/browser/modules -Filter '*.js')) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --check electron/main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem tests -Filter '*.test.js' | ForEach-Object FullName)
          node --test @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build .NET solution
        run: dotnet build Mezhs.sln -c Release --nologo

      - name: Agent command protocol and real Executor smoke
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/agent-protocol-result.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/diagnostics-architecture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Agent API model and policy smoke
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/agent-api-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Agent Web UI and proxy regression tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/agent-web-shared-ui.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/agent-web-proxy-resilience.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Architecture, provider lifecycle, and embedded module contracts
        shell: pwsh
        run: |
          foreach ($test in @(
            'agent-architecture.ps1',
            'agent-provider-lifetime.ps1',
            'integration-resources.ps1'
          )) {
            pwsh -NoProfile -File (Join-Path tests $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Browser module publication and version consistency
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP ('mezhs-module-probe-' + [Guid]::NewGuid().ToString('N'))
          try {
            dotnet run --project tests/ChatGptPackagingProbe/ChatGptPackagingProbe.csproj -c Release -- $temp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Agent concurrency and restart recovery
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/agent-runtime-resilience.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agent-graceful-shutdown.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify both frontend build outputs
        shell: pwsh
        run: |
          # Mezhs.Agent.Web.csproj and Mezhs.Web.csproj already run npm build
          # during dotnet build; do not reinstall and rebuild the same UI twice.
          foreach ($path in @(
            'src/Mezhs.Agent.Web/dist/index.html',
            'src/Mezhs.Web/ClientApp/dist/index.html'
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "The solution build did not produce $path."
            }
          }
