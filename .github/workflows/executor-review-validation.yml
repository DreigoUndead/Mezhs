name: Executor review validation

on:
  push:
    branches: [executor-foundation]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: executor-foundation

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: build
        name: Build solution
        continue-on-error: true
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release

      - id: console_test
        name: Console framework self-test
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project tests/Mezhs.Console.TestApp -c Release --no-build -- Test

      - id: executor_test
        name: Executor self-test
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project src/Mezhs.Executor -c Release --no-build -- Test

      - id: executor_lifecycle
        name: Executor lifecycle
        continue-on-error: true
        shell: pwsh
        run: ./tests/executor-lifecycle.ps1

      - id: executor_restart
        name: Executor self restart
        continue-on-error: true
        shell: pwsh
        run: ./tests/executor-self-restart.ps1

      - id: agent_recovery
        name: Agent cancellation recovery
        continue-on-error: true
        shell: pwsh
        run: ./tests/agent-cancel-recovery.ps1

      - id: agent_architecture
        name: Agent architecture
        continue-on-error: true
        shell: pwsh
        run: ./tests/agent-architecture.ps1

      - id: web_build
        name: Agent Web build
        continue-on-error: true
        shell: pwsh
        working-directory: src/Mezhs.Agent.Web
        run: |
          npm install
          npm run build

      - name: Write validation result
        if: always()
        shell: pwsh
        run: |
          @"
          build=${{ steps.build.outcome }}
          console_test=${{ steps.console_test.outcome }}
          executor_test=${{ steps.executor_test.outcome }}
          executor_lifecycle=${{ steps.executor_lifecycle.outcome }}
          executor_restart=${{ steps.executor_restart.outcome }}
          agent_recovery=${{ steps.agent_recovery.outcome }}
          agent_architecture=${{ steps.agent_architecture.outcome }}
          web_build=${{ steps.web_build.outcome }}
          "@ | Set-Content .executor-review-validation.txt

          $failed = @(
            '${{ steps.build.outcome }}',
            '${{ steps.console_test.outcome }}',
            '${{ steps.executor_test.outcome }}',
            '${{ steps.executor_lifecycle.outcome }}',
            '${{ steps.executor_restart.outcome }}',
            '${{ steps.agent_recovery.outcome }}',
            '${{ steps.agent_architecture.outcome }}',
            '${{ steps.web_build.outcome }}'
          ) | Where-Object { $_ -ne 'success' }
          if ($failed.Count -eq 0) { Add-Content .executor-review-validation.txt 'overall=PASS' }
          else { Add-Content .executor-review-validation.txt 'overall=FAIL' }

      - name: Commit validation result
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .executor-review-validation.txt
          git commit -m "Record executor review validation [skip ci]"
          git push origin HEAD:executor-foundation
