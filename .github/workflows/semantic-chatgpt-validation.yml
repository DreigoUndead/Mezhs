name: Temporary ChatGPT semantic validation

on:
  push:
    branches: [agent-model-presets]

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run semantic ChatGPT tests and capture result
        shell: bash
        run: |
          set +e
          node --check electron/main.js > semantic-validation-result.txt 2>&1
          c1=$?
          node --check tests/browser-provider-operations.test.js >> semantic-validation-result.txt 2>&1
          c2=$?
          node --check tests/chatgpt-account-api.test.js >> semantic-validation-result.txt 2>&1
          c3=$?
          node --test tests/*.test.js >> semantic-validation-result.txt 2>&1
          tests=$?
          dotnet build Mezhs.sln -c Release --nologo >> semantic-validation-result.txt 2>&1
          build=$?
          printf '\nCHECK=%s %s %s TESTS=%s BUILD=%s\n' "$c1" "$c2" "$c3" "$tests" "$build" >> semantic-validation-result.txt
          if [ "$c1" -eq 0 ] && [ "$c2" -eq 0 ] && [ "$c3" -eq 0 ] && [ "$tests" -eq 0 ] && [ "$build" -eq 0 ]; then
            echo 'OVERALL=PASS' >> semantic-validation-result.txt
          else
            echo 'OVERALL=FAIL' >> semantic-validation-result.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic-validation-result.txt
          git commit -m 'Record temporary ChatGPT validation result [skip ci]'
          git push
          exit 0
