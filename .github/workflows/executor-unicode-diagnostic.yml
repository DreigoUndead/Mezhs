name: executor-unicode-diagnostic

on:
  push:
    branches: [agent-api-composition]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Probe cmd Unicode modes
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'mezhs-unicode-probe'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -LiteralPath (Join-Path $temp 'Probe.csproj') -Encoding UTF8
          @'
          using System.Diagnostics;
          using System.Text;

          const string text = "āčēģīķļņšūž ✓";
          var report = new StringBuilder();

          RunPipe("pipe-utf8-k", ["/D", "/Q", "/K", "@chcp 65001>nul"], new UTF8Encoding(false), Encoding.UTF8, $"echo {text}\r\n", report);
          RunPipe("pipe-utf16-u", ["/D", "/Q", "/U"], Encoding.Unicode, Encoding.Unicode, $"echo {text}\r\n", report);
          RunPipe("output-only", ["/D", "/Q", "/K", "@chcp 65001>nul"], new UTF8Encoding(false), Encoding.UTF8,
              "powershell -NoProfile -Command \"[Console]::OutputEncoding=[Text.UTF8Encoding]::new();[Console]::Write([char]257+[char]269+[char]275)\"\r\n", report);

          RunArgument("argument-c", text, report);
          RunBatch("batch-utf8", text, new UTF8Encoding(false), report);
          RunBatch("batch-utf8-bom", text, new UTF8Encoding(true), report);

          File.WriteAllText(Path.Combine(Environment.CurrentDirectory, ".executor-unicode-diagnostic.txt"), report.ToString(), Encoding.UTF8);

          static ProcessStartInfo BaseStartInfo()
          {
              return new ProcessStartInfo
              {
                  FileName = Environment.GetEnvironmentVariable("ComSpec") ?? "cmd.exe",
                  UseShellExecute = false,
                  RedirectStandardInput = true,
                  RedirectStandardOutput = true,
                  RedirectStandardError = true,
                  CreateNoWindow = true
              };
          }

          static void RunPipe(string name, string[] args, Encoding input, Encoding output, string payload, StringBuilder report)
          {
              using var process = new Process { StartInfo = BaseStartInfo() };
              foreach (var arg in args) process.StartInfo.ArgumentList.Add(arg);
              process.StartInfo.StandardInputEncoding = input;
              process.StartInfo.StandardOutputEncoding = output;
              process.StartInfo.StandardErrorEncoding = output;
              process.Start();
              var stdout = process.StandardOutput.ReadToEndAsync();
              var stderr = process.StandardError.ReadToEndAsync();
              process.StandardInput.Write(payload);
              process.StandardInput.Close();
              if (!process.WaitForExit(5000)) process.Kill(true);
              report.AppendLine($"=== {name} ===");
              report.AppendLine($"exit={process.ExitCode}");
              report.AppendLine("stdout=" + Escape(stdout.GetAwaiter().GetResult()));
              report.AppendLine("stderr=" + Escape(stderr.GetAwaiter().GetResult()));
          }

          static void RunArgument(string name, string text, StringBuilder report)
          {
              using var process = new Process { StartInfo = BaseStartInfo() };
              process.StartInfo.ArgumentList.Add("/D");
              process.StartInfo.ArgumentList.Add("/Q");
              process.StartInfo.ArgumentList.Add("/C");
              process.StartInfo.ArgumentList.Add($"chcp 65001>nul & echo {text}");
              process.StartInfo.StandardOutputEncoding = Encoding.UTF8;
              process.StartInfo.StandardErrorEncoding = Encoding.UTF8;
              process.Start();
              process.StandardInput.Close();
              var stdout = process.StandardOutput.ReadToEnd();
              var stderr = process.StandardError.ReadToEnd();
              process.WaitForExit();
              report.AppendLine($"=== {name} ===");
              report.AppendLine($"exit={process.ExitCode}");
              report.AppendLine("stdout=" + Escape(stdout));
              report.AppendLine("stderr=" + Escape(stderr));
          }

          static void RunBatch(string name, string text, Encoding encoding, StringBuilder report)
          {
              var path = Path.Combine(Path.GetTempPath(), $"mezhs-{Guid.NewGuid():N}.cmd");
              File.WriteAllText(path, $"@chcp 65001>nul\r\necho {text}\r\n", encoding);
              try
              {
                  using var process = new Process { StartInfo = BaseStartInfo() };
                  process.StartInfo.ArgumentList.Add("/D");
                  process.StartInfo.ArgumentList.Add("/Q");
                  process.StartInfo.ArgumentList.Add("/C");
                  process.StartInfo.ArgumentList.Add(path);
                  process.StartInfo.StandardOutputEncoding = Encoding.UTF8;
                  process.StartInfo.StandardErrorEncoding = Encoding.UTF8;
                  process.Start();
                  process.StandardInput.Close();
                  var stdout = process.StandardOutput.ReadToEnd();
                  var stderr = process.StandardError.ReadToEnd();
                  process.WaitForExit();
                  report.AppendLine($"=== {name} ===");
                  report.AppendLine($"exit={process.ExitCode}");
                  report.AppendLine("stdout=" + Escape(stdout));
                  report.AppendLine("stderr=" + Escape(stderr));
              }
              finally { File.Delete(path); }
          }

          static string Escape(string value) => value.Replace("\r", "\\r").Replace("\n", "\\n");
          '@ | Set-Content -LiteralPath (Join-Path $temp 'Program.cs') -Encoding UTF8

          dotnet run --project (Join-Path $temp 'Probe.csproj') -c Release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .executor-unicode-diagnostic.txt
          git commit -m 'Record Executor Unicode diagnostic [skip ci]'
          git push
