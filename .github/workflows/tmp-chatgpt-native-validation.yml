name: Temporary ChatGPT native validation

on:
  push:
    branches:
      - agent-model-presets

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and self-report
        shell: bash
        run: |
          set +e
          node --test tests/chatgpt-account-api.test.js tests/browser-provider-operations.test.js > /tmp/node-tests.log 2>&1
          NODE_EXIT=$?
          dotnet build Mezhs.sln --configuration Release --nologo > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          if [ "$NODE_EXIT" -eq 0 ] && [ "$BUILD_EXIT" -eq 0 ]; then
            OVERALL=PASS
          else
            OVERALL=FAIL
          fi
          {
            echo "# Temporary ChatGPT validation"
            echo
            echo "overall: $OVERALL"
            echo "node_tests_exit: $NODE_EXIT"
            echo "build_exit: $BUILD_EXIT"
            echo
            echo "## Node tests"
            echo '~~~'
            tail -n 120 /tmp/node-tests.log
            echo '~~~'
            echo
            echo "## Build"
            echo '~~~'
            tail -n 120 /tmp/build.log
            echo '~~~'
          } > .github/chatgpt-native-validation-result.md
          cat .github/chatgpt-native-validation-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/chatgpt-native-validation-result.md
          git commit -m "Record temporary ChatGPT validation [skip ci]"
          git push
          exit "$(( NODE_EXIT != 0 || BUILD_EXIT != 0 ))"
