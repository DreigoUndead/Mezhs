name: Agent model selection fix validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build solution and web UI
        run: dotnet build Mezhs.sln -c Release
      - name: Browser module tests
        run: node --test tests/*.test.js
      - name: Architecture guards
        shell: pwsh
        run: |
          ./tests/architecture.ps1
          ./tests/grok-architecture.ps1
          ./tests/integration-resources.ps1
      - name: ChatGPT account integration tests
        shell: pwsh
        run: ./tests/account-login-flow.ps1
      - name: API smoke tests
        shell: pwsh
        run: ./tests/api-smoke.ps1
