name: Follow-up connection validation

on:
  push:
    branches:
      - agent/resolve-todo-architecture

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release
      - name: Run API smoke regression
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/api-smoke.ps1
