name: Temporary Agent composer target validation

on:
  push:
    branches:
      - agent-model-presets

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release
      - name: Project architecture
        shell: pwsh
        run: ./tests/architecture.ps1
      - name: Agent architecture
        shell: pwsh
        run: ./tests/agent-architecture.ps1
      - name: Agent shared UI
        shell: pwsh
        run: ./tests/agent-web-shared-ui.ps1
      - name: Agent API smoke
        shell: pwsh
        run: ./tests/agent-api-smoke.ps1
