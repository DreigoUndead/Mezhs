name: Temporary Grok validation

on:
  push:
    branches:
      - agent/grok-account-integration

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser dependencies
        shell: pwsh
        run: npm ci --prefix electron

      - name: Install TypeScript
        shell: pwsh
        run: npm install --global typescript

      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release

      - name: Typecheck browser modules
        shell: pwsh
        run: |
          Get-ChildItem integrations -Recurse -Filter tsconfig.json | ForEach-Object {
            Write-Host "TYPECHECK $($_.FullName)"
            tsc -p $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "TypeScript failed: $($_.FullName)" }
          }

      - name: Run JavaScript tests
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter *.test.js | ForEach-Object {
            Write-Host "TEST $($_.Name)"
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript test failed: $($_.Name)" }
          }

      - name: Run deterministic PowerShell tests
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter *.ps1 |
            Where-Object { $_.Name -notlike 'live-*' } |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "TEST $($_.Name)"
              & $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "PowerShell test failed: $($_.Name)" }
            }
