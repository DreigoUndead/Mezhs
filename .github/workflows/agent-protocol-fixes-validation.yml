name: agent-protocol-fixes-validation

on:
  push:
    branches: [agent-api-composition]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          $report = [System.Collections.Generic.List[string]]::new()

          function Run-Check([string]$name, [scriptblock]$action) {
              $report.Add("=== $name ===")
              $global:LASTEXITCODE = 0
              $output = & $action 2>&1 | Out-String
              $code = $LASTEXITCODE
              $report.Add($output.TrimEnd())
              $report.Add("exitCode=$code")
              if ($code -ne 0) {
                  $script:failed = $true
                  $report.Add("RESULT=FAIL")
              } else {
                  $report.Add("RESULT=PASS")
              }
              $report.Add('')
          }

          Run-Check 'build' { dotnet build Mezhs.sln -c Release }
          Run-Check 'policy-decoder' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/policy-decoder.ps1 }
          Run-Check 'agent-protocol-result' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/agent-protocol-result.ps1 }
          Run-Check 'executor-lifecycle' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/executor-lifecycle.ps1 }
          Run-Check 'executor-self-restart' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/executor-self-restart.ps1 }
          Run-Check 'agent-runtime-resilience' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/agent-runtime-resilience.ps1 }
          Run-Check 'agent-cancel-recovery' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/agent-cancel-recovery.ps1 }
          Run-Check 'agent-executor-evidence' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/agent-executor-evidence.ps1 }
          Run-Check 'agent-architecture' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/agent-architecture.ps1 }
          Run-Check 'architecture' { pwsh -NoProfile -ExecutionPolicy Bypass -File tests/architecture.ps1 }

          $report.Add("OVERALL=" + $(if ($failed) { 'FAIL' } else { 'PASS' }))
          $report | Set-Content -LiteralPath .agent-protocol-fixes-validation.txt -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent-protocol-fixes-validation.txt
          git commit -m 'Record Agent protocol validation [skip ci]'
          git push

          if ($failed) { exit 1 }
