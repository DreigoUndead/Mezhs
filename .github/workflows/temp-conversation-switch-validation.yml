name: Temporary conversation switch validation

on:
  push:
    branches:
      - refactor/standardize-conversation-switching

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release
      - name: Test canonical restore prompt
        shell: pwsh
        run: ./tests/conversation-restore-prompt.ps1
      - name: Run API smoke test
        shell: pwsh
        run: ./tests/api-smoke.ps1
