name: Temporary audited Agent fix validation

on:
  push:
    branches:
      - agent-api-foundation

permissions:
  contents: write

concurrency:
  group: audited-agent-fix-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-api-foundation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply remaining audited fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > .agent-audit-fix.py
          python .agent-audit-fix.py
          rm .agent-audit-fix.py
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release
      - name: Agent architecture
        shell: pwsh
        run: ./tests/agent-architecture.ps1
      - name: Shared Agent UI
        shell: pwsh
        run: ./tests/agent-web-shared-ui.ps1
      - name: Policy, queue, shell, and protocol behavior
        shell: pwsh
        run: ./tests/policy-decoder.ps1
      - name: Agent API smoke
        shell: pwsh
        run: ./tests/agent-api-smoke.ps1
      - name: Agent runtime resilience
        shell: pwsh
        run: ./tests/agent-runtime-resilience.ps1
      - name: Commit validated remaining fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENT_API_TODO.md TODO.md agent.yaml tests src
          if (git diff --cached --quiet) { throw "No remaining fix changes were produced." }
          git commit -m "Complete audited Agent fixes [skip ci]"
          git push origin HEAD:agent-api-foundation
