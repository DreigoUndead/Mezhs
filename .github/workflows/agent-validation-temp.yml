name: Temporary Agent validation

on:
  push:
    branches:
      - agent-api-foundation

concurrency:
  group: temporary-agent-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release
      - name: Agent architecture
        shell: pwsh
        run: ./tests/agent-architecture.ps1
      - name: Shared Agent UI
        shell: pwsh
        run: ./tests/agent-web-shared-ui.ps1
      - name: Policy, queue, and shell behavior
        shell: pwsh
        run: ./tests/policy-decoder.ps1
      - name: Agent API smoke
        shell: pwsh
        run: ./tests/agent-api-smoke.ps1
      - name: Agent runtime resilience
        shell: pwsh
        run: ./tests/agent-runtime-resilience.ps1
