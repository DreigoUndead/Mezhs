name: Temporary Agent validation

on:
  push:
    branches:
      - agent-api-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test Agent changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $checks = @(
            @{ Name = "dotnet build Mezhs.sln -c Release"; Command = { & dotnet build Mezhs.sln -c Release } },
            @{ Name = "tests/agent-architecture.ps1"; Command = { & pwsh -NoProfile -File tests/agent-architecture.ps1 } },
            @{ Name = "tests/agent-web-shared-ui.ps1"; Command = { & pwsh -NoProfile -File tests/agent-web-shared-ui.ps1 } },
            @{ Name = "tests/policy-decoder.ps1"; Command = { & pwsh -NoProfile -File tests/policy-decoder.ps1 } },
            @{ Name = "tests/agent-api-smoke.ps1"; Command = { & pwsh -NoProfile -File tests/agent-api-smoke.ps1 } },
            @{ Name = "tests/agent-runtime-resilience.ps1"; Command = { & pwsh -NoProfile -File tests/agent-runtime-resilience.ps1 } }
          )

          $result = New-Object System.Text.StringBuilder
          $failed = $false
          foreach ($check in $checks) {
            [void]$result.AppendLine("=== $($check.Name) ===")
            $output = & $check.Command 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            [void]$result.AppendLine("exitCode=$exitCode")
            [void]$result.AppendLine($output)
            if ($exitCode -ne 0) {
              $failed = $true
              break
            }
          }
          [void]$result.AppendLine($(if ($failed) { "OVERALL: FAIL" } else { "OVERALL: PASS" }))
          $result.ToString() | Set-Content -LiteralPath .agent-validation-result.txt -Encoding UTF8
      - name: Publish validation result
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-validation-result.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record temporary Agent validation [skip ci]"
            git push
          }
      - name: Enforce validation result
        if: always()
        shell: pwsh
        run: |
          $result = Get-Content -LiteralPath .agent-validation-result.txt -Raw
          if ($result -notmatch "OVERALL: PASS") {
            Write-Error "Agent validation failed. See .agent-validation-result.txt."
            exit 1
          }
