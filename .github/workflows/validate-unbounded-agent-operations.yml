name: Validate unbounded Agent operation lifetime

on:
  push:
    branches:
      - fix-chatgpt-composer-selection

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Electron test runtime
        shell: pwsh
        run: npm ci --prefix electron
      - name: Node tests
        shell: pwsh
        run: node --test tests/*.test.js
      - name: Policy behavior
        shell: pwsh
        run: ./tests/policy-decoder.ps1
      - name: Agent provider lifetime
        shell: pwsh
        run: ./tests/agent-provider-lifetime.ps1
      - name: Integration cancellation contract
        shell: pwsh
        run: ./tests/integration-cancellation-contract.ps1
      - name: Electron operation polling
        shell: pwsh
        run: ./tests/electron-browser-identity.ps1
      - name: Architecture
        shell: pwsh
        run: ./tests/architecture.ps1
      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release
