name: Temporary Agent Parser Review
on:
  push:
    branches:
      - review/agent-parser-display-markup

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run Agent parser regressions
        shell: pwsh
        run: |
          dotnet build src/Mezhs.Agent.Api/Mezhs.Agent.Api.csproj --configuration Release --nologo *> parser-build.log
          $buildCode = $LASTEXITCODE
          if ($buildCode -eq 0) {
            & ./tests/agent-protocol-result.ps1 *> parser-tests.log
            $testCode = if ($?) { 0 } else { 1 }
          } else { $testCode = 99 }
          $status = if ($buildCode -eq 0 -and $testCode -eq 0) { 'PASS' } else { 'FAIL' }
          $report = @(
            "OVERALL: $status"
            "Build exit: $buildCode"
            "Agent parser test exit: $testCode"
            "===== Agent parser tests ====="
          ) + @(Get-Content parser-tests.log -ErrorAction SilentlyContinue | Select-Object -Last 120) + @(
            "===== Build last 80 lines ====="
          ) + @(Get-Content parser-build.log -ErrorAction SilentlyContinue | Select-Object -Last 80)
          $report | Set-Content -Path .agent-parser-validation.txt
          $report | ForEach-Object { Write-Output $_ }
      - name: Commit verification evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-parser-validation.txt
          if (!(git diff --cached --quiet)) {
            git commit -m "Record parser validation [skip ci]"
            git push
          }
