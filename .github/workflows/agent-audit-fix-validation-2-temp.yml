name: Temporary Agent smoke runtime diagnostic

on:
  push:
    branches:
      - agent-api-foundation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-api-foundation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply audited API fixes and diagnostic
        shell: pwsh
        run: |
          @'
          import base64
          import gzip
          import subprocess
          from pathlib import Path

          legacy = subprocess.check_output([
              "git", "show",
              "67ac9bec6847a32fce238af759b896871c76b2e0:.github/workflows/agent-audit-fix-validation-temp.yml"
          ], text=True)
          start_marker = "echo '"
          end_marker = "' | base64 -d | gzip -d > .agent-audit-fix.py"
          start = legacy.index(start_marker) + len(start_marker)
          end = legacy.index(end_marker, start)
          script = gzip.decompress(base64.b64decode(legacy[start:end])).decode("utf-8")
          Path(".agent-audit-fix.py").write_text(script, encoding="utf-8", newline="\n")
          subprocess.run(["python", ".agent-audit-fix.py"], check=True)
          Path(".agent-audit-fix.py").unlink()

          program_path = Path("src/Mezhs.Agent.Api/Program.cs")
          program = program_path.read_text(encoding="utf-8")
          if "static string FindConfigPath(" not in program:
              program += r'''

          static string FindConfigPath(string? configuredPath)
          {
              if (!string.IsNullOrWhiteSpace(configuredPath))
                  return Path.GetFullPath(configuredPath);
              var currentCandidate = Path.GetFullPath("agent.yaml");
              if (File.Exists(currentCandidate))
                  return currentCandidate;
              var directory = new DirectoryInfo(AppContext.BaseDirectory);
              while (directory is not null)
              {
                  if (File.Exists(Path.Combine(directory.FullName, "Mezhs.sln")))
                  {
                      var repositoryCandidate = Path.Combine(directory.FullName, "agent.yaml");
                      if (File.Exists(repositoryCandidate))
                          return repositoryCandidate;
                  }
                  directory = directory.Parent;
              }
              var outputCandidate = Path.Combine(AppContext.BaseDirectory, "agent.yaml");
              if (File.Exists(outputCandidate))
                  return outputCandidate;
              return currentCandidate;
          }
          '''
              program_path.write_text(program, encoding="utf-8", newline="\n")

          smoke_path = Path("tests/agent-api-smoke.ps1")
          smoke = smoke_path.read_text(encoding="utf-8")
          old_selector = '    $protocolMessage = @($environmentMessages | Where-Object { $_.role -eq "assistant" -and @($_.commands).Count -gt 0 })[0]'
          new_selector = (
              '    $protocolMessage = $null\n'
              '    foreach ($candidate in $environmentMessages) {\n'
              '        if ($candidate.role -eq "assistant" -and $null -ne $candidate.commands -and $candidate.commands.Count -gt 0 -and $candidate.commands[0].name -eq "SH") {\n'
              '            $protocolMessage = $candidate\n'
              '            break\n'
              '        }\n'
              '    }'
          )
          smoke = smoke.replace(old_selector, new_selector, 1)
          smoke = smoke.replace("$protocolMessage.displayContent -match '</SH>'", "$protocolMessage.displayContent -match 'TEST_AGENT_VALUE'", 1)
          failure = '        throw "Agent message API did not expose canonical SH protocol metadata/display content."'
          diagnostic = (
              '        Write-Host ("PROTO_NULL=" + ($null -eq $protocolMessage))\n'
              '        Write-Host ("PROTO_NAME=" + $protocolMessage.commands[0].name)\n'
              '        Write-Host ("PROTO_BODY=" + $protocolMessage.commands[0].body)\n'
              '        Write-Host ("PROTO_DISPLAY=" + ($protocolMessage.displayContent | ConvertTo-Json -Compress))\n'
              + failure
          )
          smoke = smoke.replace(failure, diagnostic, 1)
          smoke_path.write_text(smoke, encoding="utf-8", newline="\n")
          '@ | Set-Content -LiteralPath .diag.py -Encoding utf8
          python .diag.py
          Remove-Item .diag.py

      - name: Build generic API
        run: dotnet build src/Mezhs.Api/Mezhs.Api.csproj -c Release
      - name: Build Agent API
        run: dotnet build src/Mezhs.Agent.Api/Mezhs.Agent.Api.csproj -c Release
      - name: Run Agent API smoke
        shell: pwsh
        run: ./tests/agent-api-smoke.ps1
