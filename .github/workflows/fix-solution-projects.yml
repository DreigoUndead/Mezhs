name: Fix solution projects

on:
  push:
    branches:
      - whatsapp-cli-foundation

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: windows-latest
    env:
      MEZHS_EXECUTION_ID: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-cli-foundation
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Add missing projects to solution
        shell: pwsh
        run: |
          dotnet sln Mezhs.sln add src/Mezhs.Console/Mezhs.Console.csproj
          dotnet sln Mezhs.sln add src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj
      - name: Build full solution
        run: dotnet build Mezhs.sln
      - name: Validate WhatsApp commands
        run: dotnet run --project src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj --no-build -- Validate
      - name: Run WhatsApp self-tests
        run: dotnet run --project src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj --no-build -- Test
      - name: Commit solution fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-solution-projects.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mezhs.sln .github/workflows/fix-solution-projects.yml
          git commit -m "Add Console and WhatsApp projects to solution"
          git push origin HEAD:whatsapp-cli-foundation
