name: One-time Codegraph refresh

on:
  push:
    branches: [rich-model-ui-rendering]
    paths:
      - .github/workflows/one-time-codegraph-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codegraph CLI
        run: npm install -g @lzehrung/codegraph@3.0.0
      - name: Regenerate portable graph with repository exporter
        run: node .agents/codegraph/export.cjs
      - name: Reject degraded graph output
        shell: pwsh
        run: |
          $graph = Get-Content .agents/codegraph/graph.json -Raw | ConvertFrom-Json
          if ($graph.analysis.backend -ne 'native' -or $graph.analysis.nativeFilesUsed -lt 100 -or $graph.fileEdges.Count -lt 500) {
            throw "Unexpected degraded Codegraph output; refusing to commit"
          }
      - name: Commit regenerated graph
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/codegraph/graph.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Graph already current"
            exit 0
          }
          git commit -m "chore(codegraph): restore native rich UI dependency graph"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rich-model-ui-rendering
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
