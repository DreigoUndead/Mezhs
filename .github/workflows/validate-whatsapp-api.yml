name: Validate WhatsApp API

on:
  push:
    branches:
      - feature/whatsapp-api

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/whatsapp-api

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Mezhs.WhatsApp.Api/package.json

      - name: Validate
        shell: bash
        run: |
          set +e
          cd src/Mezhs.WhatsApp.Api
          npm install 2>&1 | tee /tmp/npm-install.log
          install_code=${PIPESTATUS[0]}
          import_code=99
          check_code=99
          test_code=99
          if [ "$install_code" -eq 0 ]; then
            node -e "import('./src/whatsapp-account.js')" 2>&1 | tee /tmp/import.log
            import_code=${PIPESTATUS[0]}
            node --check src/server.js 2>&1 | tee /tmp/check.log
            check_code=${PIPESTATUS[0]}
            npm test 2>&1 | tee /tmp/npm-test.log
            test_code=${PIPESTATUS[0]}
          else
            echo "Adapter import not run because npm install failed." | tee /tmp/import.log
            echo "Syntax check not run because npm install failed." | tee /tmp/check.log
            echo "Tests not run because npm install failed." | tee /tmp/npm-test.log
          fi
          cd ../..
          {
            echo "npm install exit: $install_code"
            echo "adapter import exit: $import_code"
            echo "syntax check exit: $check_code"
            echo "npm test exit: $test_code"
            echo
            echo "=== npm install ==="
            cat /tmp/npm-install.log
            echo
            echo "=== adapter import ==="
            cat /tmp/import.log
            echo
            echo "=== syntax check ==="
            cat /tmp/check.log
            echo
            echo "=== npm test ==="
            cat /tmp/npm-test.log
            echo
            if [ "$install_code" -eq 0 ] && [ "$import_code" -eq 0 ] && [ "$check_code" -eq 0 ] && [ "$test_code" -eq 0 ]; then
              echo "OVERALL: PASS"
            else
              echo "OVERALL: FAIL"
            fi
          } > .agents/validation-whatsapp-api.txt

      - name: Commit validation result and lockfile
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agents/validation-whatsapp-api.txt src/Mezhs.WhatsApp.Api/package-lock.json
          git commit -m "Record WhatsApp API validation and lock dependencies [skip ci]" || exit 0
          git push
