name: agent-status-migration-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply legacy Agent status migration'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch and validate legacy status migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs'
          $text = Get-Content -LiteralPath $path -Raw
          $needle = '        SqliteDatabase.DropColumnIfExists(connection, "Executions", "Requester");'
          if (-not $text.Contains($needle)) { throw 'AgentStore migration insertion point was not found.' }
          if ($text.Contains('legacyInterrupted')) { throw 'Legacy Interrupted migration already exists.' }
          $lines = @(
            $needle,
            '',
            '        // Interrupted was a terminal Agent status before restart recovery became resumable.',
            '        // Preserve that historical terminal evidence while upgrading to the current status model.',
            '        using var legacyInterrupted = connection.CreateCommand();',
            '        legacyInterrupted.CommandText = """',
            '            UPDATE Executions',
            '            SET Status = $failed',
            '            WHERE Status = $interrupted;',
            '            """;',
            '        legacyInterrupted.Parameters.AddWithValue("$failed", AgentExecutionStatus.Failed.ToString());',
            '        legacyInterrupted.Parameters.AddWithValue("$interrupted", "Interrupted");',
            '        legacyInterrupted.ExecuteNonQuery();'
          )
          $replacement = $lines -join [Environment]::NewLine
          $text = $text.Replace($needle, $replacement)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8

          dotnet build src/Mezhs.Agent.Api/Mezhs.Agent.Api.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Agent API build failed.' }
          pwsh -NoProfile -File tests/agent-store-migration.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Legacy status migration regression test failed.' }

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Mezhs.Agent.Api/Persistence/AgentStore.cs
          git commit -m "Migrate legacy Interrupted Agent executions"
          git push
