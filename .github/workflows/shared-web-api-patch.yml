name: shared-web-api-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply shared Web API availability integration v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch Web consumers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def between(text, start, end, replacement, label):
              try:
                  start_index = text.index(start)
                  end_index = text.index(end, start_index)
              except ValueError:
                  raise SystemExit(f"{label}: boundary not found")
              return text[:start_index] + replacement + text[end_index + len(end):]

          agent_path = Path("src/Mezhs.Agent.Web/src/App.tsx")
          agent = agent_path.read_text(encoding="utf-8")
          agent = once(agent, '''import {
            ChatComposer,
            ChatTranscript,
            expectJson,
            type ChatSurfaceMessage,
          } from "@mezhs/web-lib";''', '''import {
            apiJson,
            ChatComposer,
            ChatTranscript,
            useApiAvailability,
            type ChatSurfaceMessage,
          } from "@mezhs/web-lib";''', "Agent imports")
          agent = once(agent, '''async function api<T>(path: string, init?: RequestInit): Promise<T> {
            return expectJson<T>(await fetch(path, init));
          }

          ''', '', "Agent local API helper")
          agent = once(agent, '''  const [apiReady, setApiReady] = useState(false);
            const [policies, setPolicies] = useState<AgentPolicy[]>([]);''', '''  const apiAvailability = useApiAvailability("");
            const apiReady = apiAvailability === "online";
            const [policies, setPolicies] = useState<AgentPolicy[]>([]);''', "Agent API state")

          agent = between(
              agent,
              '  useEffect(() => {\n    let cancelled = false;\n    let retryTimer: number | undefined;',
              '  }, []);\n\n  useEffect(() => {\n    if (!selectedChatId || creating) {',
              '''  useEffect(() => {
            let cancelled = false;
            void Promise.all([
              apiJson<AgentPolicy[]>("", "/v1/policies"),
              apiJson<AgentChat[]>("", "/v1/agent-chats"),
            ])
              .then(([policyValues, chatValues]) => {
                if (cancelled) return;
                setPolicies(policyValues);
                setChats(chatValues);
                setPolicyId(policyValues[0]?.id ?? "");
                setNotice(null);
                if (chatValues.length > 0)
                  setSelectedChatId(chatValues[0].chatId);
              })
              .catch((error) => {
                if (!cancelled)
                  setNotice(error instanceof Error ? error.message : "Could not load MEŽS Agent.");
              });
            return () => { cancelled = true; };
          }, []);

          useEffect(() => {
            if (!selectedChatId || creating) {''',
              "Agent bootstrap",
          )

          agent = agent.replace('api<', 'apiJson<')
          agent = re.sub(
              r'apiJson<([^>]+)>\(\s*(["`])(/v1/)',
              lambda match: f'apiJson<{match.group(1)}>("", {match.group(2)}{match.group(3)}',
              agent,
          )
          agent = once(agent, '''  useEffect(() => {
            const timer = window.setInterval(() => {
              void refreshChats();
              if (selectedChatId && !creating)
                void loadSelected(selectedChatId, false);
            }, 1200);
            return () => window.clearInterval(timer);
          }, [selectedChatId, creating]);''', '''  useEffect(() => {
            const timer = window.setInterval(() => {
              if (!apiReady) return;
              void refreshChats();
              if (selectedChatId && !creating)
                void loadSelected(selectedChatId, false);
            }, 1200);
            return () => window.clearInterval(timer);
          }, [apiReady, selectedChatId, creating]);''', "Agent refresh timer")
          agent = once(agent, '''  async function refreshChats() {
            try {
              setChats(await apiJson<AgentChat[]>("", "/v1/agent-chats"));
              setApiReady(true);
            } catch {
              setApiReady(false);
              // Keep the last durable view during transient refresh failures.
            }
          }''', '''  async function refreshChats() {
            try {
              setChats(await apiJson<AgentChat[]>("", "/v1/agent-chats"));
            } catch {
              // Keep the last durable view during transient refresh failures.
            }
          }''', "Agent refresh state")
          if 'setApiReady(' in agent or 'await fetch(' in agent or 'async function api<' in agent:
              raise SystemExit("Agent Web still owns API availability/transport")

          chat_path = Path("src/Mezhs.Web.Lib/src/MezhsChatApp.tsx")
          chat = chat_path.read_text(encoding="utf-8")
          chat = once(chat, 'import { ChatProviderRegistry } from "./providers/registry";', 'import { apiJson, apiJsonOrEmpty, useApiAvailability } from "./api";\nimport { ChatProviderRegistry } from "./providers/registry";', "Chat imports")
          chat = between(
              chat,
              'async function expectJson<T>(response: Response): Promise<T> {',
              '}\n\nexport type MezhsChatAppProps',
              'export type MezhsChatAppProps',
              "Chat local expectJson",
          )
          chat = once(chat, '''  const apiBase = apiBaseUrl.replace(/\/$/, "");
            const [connections, setConnections] = useState<Connection[]>([]);''', '''  const apiBase = apiBaseUrl.replace(/\/$/, "");
            const apiAvailability = useApiAvailability(apiBase);
            const online = apiAvailability === "online";
            const [connections, setConnections] = useState<Connection[]>([]);''', "Chat availability")
          chat = once(chat, '''  const [pendingFiles, setPendingFiles] = useState<PendingFile[]>([]);
            const [online, setOnline] = useState(false);
            const [loading, setLoading] = useState(true);''', '''  const [pendingFiles, setPendingFiles] = useState<PendingFile[]>([]);
            const [loading, setLoading] = useState(true);''', "Chat online state")

          chat = between(
              chat,
              '  useEffect(() => {\n    void (async () => {\n      try {\n        const [healthResponse, connectionResponse, chatResponse, categoryResponse]',
              '  }, [apiBase]);\n\n  useEffect(() => () => providerRegistry.current.dispose(), []);',
              '''  useEffect(() => {
            let cancelled = false;
            void Promise.all([
              apiJson<Connection[]>(apiBase, "/v1/connections"),
              apiJson<Chat[]>(apiBase, "/v1/chats"),
              apiJson<Category[]>(apiBase, "/v1/categories"),
            ])
              .then(([available, chatValues, categoryValues]) => {
                if (cancelled) return;
                providerRegistry.current.configure(apiBase, available);
                setConnections(available);
                setChats(chatValues);
                setCategories(categoryValues);
                if (available.length) setConnectionId(available[0].id);
                setNotice(null);
              })
              .catch((error) => {
                if (!cancelled)
                  setNotice(error instanceof Error ? error.message : "Could not reach MEŽS.");
              })
              .finally(() => {
                if (!cancelled) setLoading(false);
              });
            return () => { cancelled = true; };
          }, [apiBase]);

          useEffect(() => () => providerRegistry.current.dispose(), []);''',
              "Chat bootstrap",
          )

          replacements = [
              ('setChats(await expectJson<Chat[]>(await fetch(`${base}/v1/chats`)));', 'setChats(await apiJson<Chat[]>(base, "/v1/chats"));', 'loadChats'),
              ('setCategories(await expectJson<Category[]>(await fetch(`${base}/v1/categories`)));', 'setCategories(await apiJson<Category[]>(base, "/v1/categories"));', 'loadCategories'),
              ('const request = await expectJson<Message>(await fetch(`${apiBase}/v1/messages/${messageId}`));', 'const request = await apiJson<Message>(apiBase, `/v1/messages/${messageId}`);', 'poll'),
              ('const request = await expectJson<Message>(await fetch(`${apiBase}/v1/messages/${messageId}/replay`, {\n        method: "POST",\n      }));', 'const request = await apiJson<Message>(apiBase, `/v1/messages/${messageId}/replay`, {\n        method: "POST",\n      });', 'replay'),
              ('const category = await expectJson<Category>(await fetch(`${apiBase}/v1/categories`, {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ name }),\n      }));', 'const category = await apiJson<Category>(apiBase, "/v1/categories", {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ name }),\n      });', 'createCategory'),
              ('await expectJsonOrEmpty(await fetch(`${apiBase}/v1/categories/${category.categoryId}`, {\n        method: "DELETE",\n      }));', 'await apiJsonOrEmpty(apiBase, `/v1/categories/${category.categoryId}`, {\n        method: "DELETE",\n      });', 'deleteCategory'),
              ('await expectJson<Chat>(await fetch(`${apiBase}/v1/chats/${activeChat.chatId}`, {\n        method: "PATCH",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ categoryId: categoryId || null }),\n      }));', 'await apiJson<Chat>(apiBase, `/v1/chats/${activeChat.chatId}`, {\n        method: "PATCH",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ categoryId: categoryId || null }),\n      });', 'assignCategory'),
          ]
          for old, new, label in replacements:
              chat = once(chat, old, new, label)

          chat = once(chat, '''      const response = ids.length === 1
                ? await fetch(`${apiBase}/v1/chats/${encodeURIComponent(ids[0])}`, { method: "DELETE" })
                : await fetch(`${apiBase}/v1/chats`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chatIds: ids }),
                  });
              await expectJsonOrEmpty(response);''', '''      if (ids.length === 1) {
                await apiJsonOrEmpty(apiBase, `/v1/chats/${encodeURIComponent(ids[0])}`, {
                  method: "DELETE",
                });
              } else {
                await apiJsonOrEmpty(apiBase, "/v1/chats", {
                  method: "DELETE",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ chatIds: ids }),
                });
              }''', "delete conversations")

          local_empty = chat.find('\nasync function expectJsonOrEmpty(response: Response) {')
          if local_empty < 0:
              raise SystemExit("Chat local expectJsonOrEmpty not found")
          chat = chat[:local_empty] + '\n'
          if 'setOnline(' in chat or 'await fetch(' in chat or 'expectJson<' in chat or 'expectJsonOrEmpty(' in chat:
              raise SystemExit("MezhsChatApp still owns API availability/transport")

          agent_path.write_text(agent, encoding="utf-8")
          chat_path.write_text(chat, encoding="utf-8")
          '@ | python3 -
          if ($LASTEXITCODE -ne 0) { throw 'Web consumer patch failed.' }

          dotnet build src/Mezhs.Agent.Web/Mezhs.Agent.Web.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Agent Web build failed.' }
          dotnet build src/Mezhs.Web/Mezhs.Web.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'MEŽS Web build failed.' }
          pwsh -NoProfile -File tests/agent-web-shared-ui.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Shared Agent Web UI test failed.' }

      - name: Commit shared integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Mezhs.Agent.Web/src/App.tsx src/Mezhs.Web.Lib/src/MezhsChatApp.tsx
          git commit -m "Use shared API availability across Web apps"
          git push
