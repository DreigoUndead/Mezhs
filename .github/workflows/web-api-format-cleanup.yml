name: web-api-format-cleanup

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Normalize shared Web API integration formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Normalize and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          agent_path = Path("src/Mezhs.Agent.Web/src/App.tsx")
          agent = agent_path.read_text(encoding="utf-8")
          agent = once(agent, '''  useEffect(() => {
          let cancelled = false;
          void Promise.all([
            apiJson<AgentPolicy[]>("", "/v1/policies"),
            apiJson<AgentChat[]>("", "/v1/agent-chats"),
          ])
            .then(([policyValues, chatValues]) => {
              if (cancelled) return;
              setPolicies(policyValues);
              setChats(chatValues);
              setPolicyId(policyValues[0]?.id ?? "");
              setNotice(null);
              if (chatValues.length > 0)
                setSelectedChatId(chatValues[0].chatId);
            })
            .catch((error) => {
              if (!cancelled)
                setNotice(error instanceof Error ? error.message : "Could not load MEŽS Agent.");
            });
          return () => { cancelled = true; };
        }, []);

      useEffect(() => {
        if (!selectedChatId || creating) {
            setMessages([]);
            setExecutions([]);
            return;
          }
          void loadSelected(selectedChatId);
        }, [selectedChatId, creating]);

        useEffect(() => {
        const timer = window.setInterval(() => {
          if (!apiReady) return;
          void refreshChats();
          if (selectedChatId && !creating)
            void loadSelected(selectedChatId, false);
        }, 1200);
        return () => window.clearInterval(timer);
      }, [apiReady, selectedChatId, creating]);

        async function refreshChats() {
        try {
          setChats(await apiJson<AgentChat[]>("", "/v1/agent-chats"));
        } catch {
          // Keep the last durable view during transient refresh failures.
        }
      }

      async function loadSelected''', '''  useEffect(() => {
            let cancelled = false;
            void Promise.all([
              apiJson<AgentPolicy[]>("", "/v1/policies"),
              apiJson<AgentChat[]>("", "/v1/agent-chats"),
            ])
              .then(([policyValues, chatValues]) => {
                if (cancelled) return;
                setPolicies(policyValues);
                setChats(chatValues);
                setPolicyId(policyValues[0]?.id ?? "");
                setNotice(null);
                if (chatValues.length > 0)
                  setSelectedChatId(chatValues[0].chatId);
              })
              .catch((error) => {
                if (!cancelled)
                  setNotice(error instanceof Error ? error.message : "Could not load MEŽS Agent.");
              });
            return () => { cancelled = true; };
          }, []);

          useEffect(() => {
            if (!selectedChatId || creating) {
              setMessages([]);
              setExecutions([]);
              return;
            }
            void loadSelected(selectedChatId);
          }, [selectedChatId, creating]);

          useEffect(() => {
            const timer = window.setInterval(() => {
              if (!apiReady) return;
              void refreshChats();
              if (selectedChatId && !creating)
                void loadSelected(selectedChatId, false);
            }, 1200);
            return () => window.clearInterval(timer);
          }, [apiReady, selectedChatId, creating]);

          async function refreshChats() {
            try {
              setChats(await apiJson<AgentChat[]>("", "/v1/agent-chats"));
            } catch {
              // Keep the last durable view during transient refresh failures.
            }
          }

          async function loadSelected''', "agent formatting")
          agent_path.write_text(agent, encoding="utf-8")

          chat_path = Path("src/Mezhs.Web.Lib/src/MezhsChatApp.tsx")
          chat = chat_path.read_text(encoding="utf-8")
          chat = once(chat, '''  useEffect(() => {
          let cancelled = false;
          void Promise.all([
            apiJson<Connection[]>(apiBase, "/v1/connections"),
            apiJson<Chat[]>(apiBase, "/v1/chats"),
            apiJson<Category[]>(apiBase, "/v1/categories"),
          ])
            .then(([available, chatValues, categoryValues]) => {
              if (cancelled) return;
              providerRegistry.current.configure(apiBase, available);
              setConnections(available);
              setChats(chatValues);
              setCategories(categoryValues);
              if (available.length) setConnectionId(available[0].id);
              setNotice(null);
            })
            .catch((error) => {
              if (!cancelled)
                setNotice(error instanceof Error ? error.message : "Could not reach MEŽS.");
            })
            .finally(() => {
              if (!cancelled) setLoading(false);
            });
          return () => { cancelled = true; };
        }, [apiBase]);

      useEffect(() => () => providerRegistry.current.dispose(), []);''', '''  useEffect(() => {
            let cancelled = false;
            void Promise.all([
              apiJson<Connection[]>(apiBase, "/v1/connections"),
              apiJson<Chat[]>(apiBase, "/v1/chats"),
              apiJson<Category[]>(apiBase, "/v1/categories"),
            ])
              .then(([available, chatValues, categoryValues]) => {
                if (cancelled) return;
                providerRegistry.current.configure(apiBase, available);
                setConnections(available);
                setChats(chatValues);
                setCategories(categoryValues);
                if (available.length) setConnectionId(available[0].id);
                setNotice(null);
              })
              .catch((error) => {
                if (!cancelled)
                  setNotice(error instanceof Error ? error.message : "Could not reach MEŽS.");
              })
              .finally(() => {
                if (!cancelled) setLoading(false);
              });
            return () => { cancelled = true; };
          }, [apiBase]);

          useEffect(() => () => providerRegistry.current.dispose(), []);''', "chat bootstrap formatting")
          chat = once(chat, '''      if (ids.length === 1) {
            await apiJsonOrEmpty(apiBase, `/v1/chats/${encodeURIComponent(ids[0])}`, { method: "DELETE" });
          } else {
            await apiJsonOrEmpty(apiBase, "/v1/chats", {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chatIds: ids }),
            });
          }''', '''      if (ids.length === 1) {
            await apiJsonOrEmpty(apiBase, `/v1/chats/${encodeURIComponent(ids[0])}`, {
              method: "DELETE",
            });
          } else {
            await apiJsonOrEmpty(apiBase, "/v1/chats", {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chatIds: ids }),
            });
          }''', "chat delete formatting")
          chat_path.write_text(chat, encoding="utf-8")
          '@ | python3 -
          if ($LASTEXITCODE -ne 0) { throw 'Formatting patch failed.' }

          dotnet build src/Mezhs.Agent.Web/Mezhs.Agent.Web.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Agent Web build failed.' }
          dotnet build src/Mezhs.Web/Mezhs.Web.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'MEŽS Web build failed.' }

      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Mezhs.Agent.Web/src/App.tsx src/Mezhs.Web.Lib/src/MezhsChatApp.tsx
          git commit -m "Normalize shared Web API integration formatting"
          git push
