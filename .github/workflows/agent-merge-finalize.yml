name: Agent merge finalize

on:
  push:
    branches:
      - agent-api-foundation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve cross-branch edits
        shell: pwsh
        run: |
          python tests/agent-merge-finalize-temp.py
          python tests/agent-merge-compat-temp.py

      - name: Build
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release

      - name: Validate main API and Agent foundation
        shell: pwsh
        run: |
          & ./tests/api-smoke.ps1
          & ./tests/agent-architecture.ps1
          & ./tests/agent-web-shared-ui.ps1
          & ./tests/policy-decoder.ps1
          & ./tests/agent-api-smoke.ps1
          & ./tests/agent-runtime-resilience.ps1

      - name: Commit validated merge resolution
        shell: bash
        run: |
          rm .github/workflows/agent-merge-finalize.yml
          rm tests/agent-merge-finalize-temp.py
          rm tests/agent-merge-compat-temp.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Resolve Agent API merge with main"
          git push origin HEAD:agent-api-foundation
