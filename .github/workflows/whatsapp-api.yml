name: WhatsApp API

on:
  pull_request:
    paths:
      - 'src/Mezhs.WhatsApp.Api/**'
      - '.github/workflows/whatsapp-api.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Mezhs.WhatsApp.Api/**'
      - '.github/workflows/whatsapp-api.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/Mezhs.WhatsApp.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Mezhs.WhatsApp.Api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
