name: agent-api-validation

on:
  push:
    branches: [agent-api-foundation]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet build Mezhs.sln -c Release *> validation-output.txt
          "exitCode=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
      - name: Write validation result
        shell: pwsh
        run: |
          $exitCode = '${{ steps.build.outputs.exitCode }}'
          $status = if ($exitCode -eq '0') { 'PASS' } else { 'FAIL' }
          "OVERALL: $status`nEXIT_CODE: $exitCode`n`n" | Set-Content .agent-api-validation-result.txt
          Get-Content validation-output.txt | Add-Content .agent-api-validation-result.txt
      - name: Commit result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-api-validation-result.txt
          git commit -m "agent api validation result [skip ci]"
          git push
