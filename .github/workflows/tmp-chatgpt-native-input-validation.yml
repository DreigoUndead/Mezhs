name: Temporary ChatGPT native input validation

on:
  push:
    branches:
      - agent-model-presets
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ChatGPT provider and trace tests
        run: node --test tests/chatgpt-account-api.test.js tests/browser-provider-operations.test.js tests/chatgpt-native-trace.test.js
      - name: Parse native trace PowerShell harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tests/chatgpt-native-trace.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Release build
        run: dotnet build Mezhs.sln --configuration Release
