name: Executor diagnostic

on:
  push:
    branches: [ executor-foundation ]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Decouple Agent execution refresh from chat messages
        shell: pwsh
        run: |
          $path = 'src/Mezhs.Agent.Web/src/App.tsx'
          $source = [IO.File]::ReadAllText($path)
          $old = @'
            async function loadSelected(chatId: string, reportErrors = true) {
              try {
                const [messageValues, executionValues] = await Promise.all([
                  api<AgentChatMessage[]>(`/v1/agent-chats/${encodeURIComponent(chatId)}/messages`),
                  api<Execution[]>(`/v1/agent-chats/${encodeURIComponent(chatId)}/executions`),
                ]);
                setMessages(messageValues);
                setExecutions(executionValues);
              } catch (error) {
                if (reportErrors)
                  setNotice(error instanceof Error ? error.message : "Could not load this agent chat.");
              }
            }
          '@
          $new = @'
            async function loadSelected(chatId: string, reportErrors = true) {
              const results = await Promise.allSettled([
                api<AgentChatMessage[]>(`/v1/agent-chats/${encodeURIComponent(chatId)}/messages`).then(setMessages),
                api<Execution[]>(`/v1/agent-chats/${encodeURIComponent(chatId)}/executions`).then(setExecutions),
              ]);
              if (!reportErrors)
                return;

              const failure = results.find((result) => result.status === "rejected");
              if (failure?.status === "rejected")
                setNotice(failure.reason instanceof Error ? failure.reason.message : "Could not fully refresh this agent chat.");
            }
          '@
          if (-not $source.Contains($old)) { throw 'Expected Agent Web loadSelected implementation was not found.' }
          [IO.File]::WriteAllText($path, $source.Replace($old, $new), [Text.UTF8Encoding]::new($false))
      - name: Build
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release
      - name: Validate reported failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("head=$env:GITHUB_SHA")
          $lines.Add("generated=$([DateTimeOffset]::UtcNow.ToString('O'))")

          $lines.Add('=== lifecycle stress ===')
          for ($i = 1; $i -le 8; $i++) {
            $output = & pwsh -NoProfile -File tests/executor-lifecycle.ps1 2>&1
            $code = $LASTEXITCODE
            $lines.Add("run=$i exit=$code")
            foreach ($line in $output) { $lines.Add([string]$line) }
            if ($code -ne 0) { break }
          }

          $lines.Add('=== Agent API/Web outage debug log ===')
          $smoke = & pwsh -NoProfile -File tests/agent-api-smoke.ps1 2>&1
          $smokeCode = $LASTEXITCODE
          $lines.Add("exit=$smokeCode")
          foreach ($line in $smoke) { $lines.Add([string]$line) }

          $lines.Add('=== Agent Web ownership checks ===')
          $web = & pwsh -NoProfile -File tests/agent-web-shared-ui.ps1 2>&1
          $webCode = $LASTEXITCODE
          $lines.Add("exit=$webCode")
          foreach ($line in $web) { $lines.Add([string]$line) }

          $failed = ($lines | Where-Object { $_ -match '^run=\d+ exit=[^0]$|^exit=[^0]$' }).Count -gt 0
          $lines | Set-Content executor-diagnostic-result.txt -Encoding utf8
          if ($failed) { exit 1 }
      - name: Commit validated source and result
        if: success()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Mezhs.Agent.Web/src/App.tsx executor-diagnostic-result.txt
          git commit -m "Apply validated Agent UI refresh repair [skip ci]" || exit 0
          git push
