name: Temporary agent model validation

on:
  push:
    branches:
      - agent-model-presets
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provider tests
        run: node --test tests/chatgpt-account-api.test.js tests/browser-provider-operations.test.js
      - name: Release build
        run: dotnet build Mezhs.sln --configuration Release
