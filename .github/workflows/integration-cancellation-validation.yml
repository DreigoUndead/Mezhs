name: Integration cancellation validation

on:
  push:
    branches: [agent-api-composition]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run validation and record result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $result = Join-Path $PWD 'integration-cancellation-validation.txt'
          $failed = $false
          function Run-Step([string] $name, [scriptblock] $command) {
            Add-Content $result "=== $name ==="
            & $command *>&1 | Tee-Object -FilePath $result -Append
            $code = $LASTEXITCODE
            Add-Content $result "EXIT: $code`n"
            if ($code -ne 0) { $script:failed = $true }
          }
          Set-Content $result ''
          Run-Step 'dotnet build' { dotnet build Mezhs.sln -c Release }
          Run-Step 'integration cancellation contract' { pwsh -NoProfile -File tests/integration-cancellation-contract.ps1 }
          Run-Step 'Agent/provider lifetime checks' { pwsh -NoProfile -File tests/agent-provider-lifetime.ps1 }
          Run-Step 'ChatGPT native request tests' { node --test tests/chatgpt-native-request.test.js tests/chatgpt-native-send-lifetime.test.js }
          Run-Step 'Agent runtime resilience' { pwsh -NoProfile -File tests/agent-runtime-resilience.ps1 }
          Run-Step 'Agent cancellation recovery' { pwsh -NoProfile -File tests/agent-cancel-recovery.ps1 }
          Add-Content $result ($(if ($failed) { 'OVERALL: FAIL' } else { 'OVERALL: PASS' }))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-cancellation-validation.txt
          git commit -m 'Record temporary integration cancellation validation [skip ci]'
          git push
          if ($failed) { exit 1 }
