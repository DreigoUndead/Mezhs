name: Retry audit fixes

on:
  push:
    branches:
      - whatsapp-cli-foundation

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-2025
    env:
      MEZHS_EXECUTION_ID: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply fixes from audited patch script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-audit-fixes.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Apply audited fixes\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Install WhatsApp API dependencies"
          start = workflow.find(start_marker)
          if start < 0:
              raise RuntimeError('audit patch start marker was not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise RuntimeError('audit patch end marker was not found')
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'audit-fixes.py', 'exec'), {'__name__': '__main__'})

      - name: Install WhatsApp API dependencies
        working-directory: src/Mezhs.WhatsApp.Api
        run: npm ci

      - name: Check WhatsApp API syntax
        working-directory: src/Mezhs.WhatsApp.Api
        run: npm run check

      - name: Test WhatsApp API
        working-directory: src/Mezhs.WhatsApp.Api
        run: npm test

      - name: Test ChatGPT composer and native request path
        run: node --test tests/chatgpt-prompt-editor.test.js tests/chatgpt-native-request.test.js

      - name: Build full solution
        run: dotnet build Mezhs.sln

      - name: Test console framework
        run: dotnet run --project tests/Mezhs.Console.TestApp/Mezhs.Console.TestApp.csproj -- Test

      - name: Validate WhatsApp commands
        run: dotnet run --project src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj --no-build -- Validate

      - name: Test WhatsApp CLI
        run: dotnet run --project src/Mezhs.WhatsApp/Mezhs.WhatsApp.csproj --no-build -- Test

      - name: Commit validated production changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/Mezhs.Integrations.ChatGpt/browser/chatgpt.ts tests/chatgpt-prompt-editor.test.js src/Mezhs.WhatsApp.Api src/Mezhs.WhatsApp src/Mezhs.Console tests/Mezhs.Console.TestApp/Program.cs
          if (git diff --cached --name-only | Select-String '^\.github/') { throw 'Temporary workflow change entered production commit.' }
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix WhatsApp audit findings and ChatGPT composer [skip ci]"
            git push
          }
