name: Validate ChatGPT composer fix

on:
  push:
    branches:
      - fix-chatgpt-composer-selection

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ChatGPT prompt editor tests
        run: node --test tests/chatgpt-prompt-editor.test.js
