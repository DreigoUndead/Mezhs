name: Common Validation

on:
  push:
    branches:
      - executor-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Add Common to solution
        run: dotnet sln Mezhs.sln add src/Mezhs.Common/Mezhs.Common.csproj
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release --nologo
      - name: Common regression suite
        run: dotnet run --project tests/Mezhs.Common.TestApp/Mezhs.Common.TestApp.csproj -c Release
      - name: Console regression suite
        run: dotnet run --project tests/Mezhs.Console.TestApp/Mezhs.Console.TestApp.csproj -c Release -- Test
      - name: Executor self-test
        run: dotnet run --project src/Mezhs.Executor/Mezhs.Executor.csproj -c Release --no-build -- Test
      - name: Persist solution membership
        shell: pwsh
        run: |
          if (git diff --quiet -- Mezhs.sln) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mezhs.sln
          git commit -m "Add Mezhs.Common to solution [skip ci]"
          git push
