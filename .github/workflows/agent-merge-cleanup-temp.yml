name: Agent merge cleanup

on:
  push:
    branches:
      - agent-api-foundation

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-and-clean:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflow from review branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/agent-merge-cleanup-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Agent merge cleanup"
          git push origin HEAD:agent-api-foundation

      - name: Merge approved Agent PR and delete branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = $env:GITHUB_REPOSITORY
          $headSha = (git rev-parse HEAD).Trim()
          $body = @{ merge_method = "merge"; sha = $headSha } | ConvertTo-Json
          $merged = $false
          $lastError = $null
          for ($attempt = 1; $attempt -le 6 -and -not $merged; $attempt++) {
            try {
              $response = Invoke-RestMethod -Method Put -Uri "https://api.github.com/repos/$repo/pulls/10/merge" -Headers $headers -ContentType "application/json" -Body $body
              if ($response.merged) {
                $merged = $true
              } else {
                $lastError = $response.message
              }
            } catch {
              $lastError = $_.Exception.Message
            }
            if (-not $merged) { Start-Sleep -Seconds 5 }
          }
          if (-not $merged) { throw "PR #10 merge failed: $lastError" }

          $branchUri = "https://api.github.com/repos/$repo/git/refs/heads/agent-api-foundation"
          try {
            Invoke-RestMethod -Method Delete -Uri $branchUri -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
