name: agent-api-composition-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Require atomic chat attachment'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten atomic chat claim
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs'
          $text = Get-Content -LiteralPath $path -Raw
          $old = '            attach.ExecuteNonQuery();'
          $new = @(
            '            if (attach.ExecuteNonQuery() != 1)',
            '                throw new InvalidOperationException(',
            '                    $"Execution ''{executionId}'' changed state before Agent chat ''{chatId}'' could be claimed.");'
          ) -join "`n"
          if (-not $text.Contains($old)) { throw 'Could not locate atomic attachment update.' }
          [IO.File]::WriteAllText((Resolve-Path $path), $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "Require atomic Agent chat attachment [skip ci]"
          git push
