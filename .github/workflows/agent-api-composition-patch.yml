name: agent-api-composition-patch

on:
  push:
    branches:
      - agent-api-composition

jobs:
  patch:
    if: github.event.head_commit.message == 'Check baseline Unicode [skip ci]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reproduce policy Unicode test on executor-foundation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          chcp 65001 | Out-Null
          [Console]::InputEncoding = [Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding

          git worktree add baseline origin/executor-foundation
          if ($LASTEXITCODE -ne 0) { throw 'Could not create executor-foundation worktree.' }
          Push-Location baseline
          try {
            pwsh -NoProfile -File tests/policy-decoder.ps1
            $code = $LASTEXITCODE
            Write-Host "BASELINE_POLICY_DECODER_EXIT=$code"
          }
          finally {
            Pop-Location
          }
          # This job is evidence collection; expose the exit code in logs without making the workflow itself red.
          exit 0
