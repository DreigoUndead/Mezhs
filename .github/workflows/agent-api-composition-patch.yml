name: agent-api-composition-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Make Agent chat claim atomic v2'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make chat ownership publication atomic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-Utf8([string]$path, [string]$text) {
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          }

          function Replace-LiteralRegex([string]$path, [string]$pattern, [string]$replacement) {
            $text = Get-Content -LiteralPath $path -Raw
            $options = [Text.RegularExpressions.RegexOptions]::Singleline
            $regex = [regex]::new($pattern, $options)
            if (-not $regex.IsMatch($text)) { throw "Expected pattern not found in $path`n$pattern" }
            $updated = $regex.Replace($text, [Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
            Write-Utf8 $path $updated
          }

          Replace-LiteralRegex 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs' `
            '\r?\n    public void AttachChat\(string executionId, string chatId\).*?(?=\r?\n    public void ClaimAgentChat)' `
            ''

          $signature = @(
            '    public void ClaimAgentChat(',
            '        string executionId,',
            '        string chatId,'
          ) -join "`n"
          Replace-LiteralRegex 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs' `
            '    public void ClaimAgentChat\(\s*string chatId,' `
            $signature

          $store = Get-Content -LiteralPath 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs' -Raw
          $attachBlock = @(
            '        using (var attach = connection.CreateCommand())',
            '        {',
            '            attach.Transaction = transaction;',
            '            attach.CommandText = """',
            '                UPDATE Executions',
            '                SET ChatId = $chatId',
            '                WHERE ExecutionId = $executionId',
            '                  AND Kind = $agentKind',
            '                  AND Status IN ($queued, $running);',
            '                """;',
            '            attach.Parameters.AddWithValue("$chatId", chatId);',
            '            attach.Parameters.AddWithValue("$executionId", executionId);',
            '            attach.Parameters.AddWithValue("$agentKind", AgentExecutionKind.Agent.ToString());',
            '            attach.Parameters.AddWithValue("$queued", AgentExecutionStatus.Queued.ToString());',
            '            attach.Parameters.AddWithValue("$running", AgentExecutionStatus.Running.ToString());',
            '            attach.ExecuteNonQuery();',
            '        }'
          ) -join "`n"
          $commitBoundary = [regex]::new(
            '(?s)(        using \(var update = connection\.CreateCommand\(\)\).*?            update\.ExecuteNonQuery\(\);\r?\n        \})\r?\n\r?\n        transaction\.Commit\(\);')
          if (-not $commitBoundary.IsMatch($store)) { throw 'Could not locate ClaimAgentChat commit boundary.' }
          $store = $commitBoundary.Replace(
            $store,
            [Text.RegularExpressions.MatchEvaluator]{ param($m) $m.Groups[1].Value + "`n`n" + $attachBlock + "`n`n        transaction.Commit();" },
            1)
          $store = [regex]::Replace(
            $store,
            '(?s)\r?\n    private void UpdateActive\(string executionId, string sql, Action<SqliteCommand> bind\).*?(?=\r?\n    private static void EnsurePolicyMatches)',
            '',
            1)
          Write-Utf8 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs' $store

          Replace-LiteralRegex 'src/Mezhs.Agent.Api/Services/AgentWorker.cs' `
            '                chatId = _chats\.Create\(new CreateChatRequest\(execution\.ConnectionId\)\)\.ChatId;\s*_store\.AttachChat\(executionId, chatId\);\s*execution\.ChatId = chatId;\s*cancellation\.Token\.ThrowIfCancellationRequested\(\);' `
            ("                chatId = _chats.Create(new CreateChatRequest(execution.ConnectionId)).ChatId;`n                cancellation.Token.ThrowIfCancellationRequested();")

          Replace-LiteralRegex 'src/Mezhs.Agent.Api/Services/AgentWorker.cs' `
            '_store\.ClaimAgentChat\(\s*chatId,' `
            ("_store.ClaimAgentChat(`n                executionId,`n                chatId,")

          Replace-LiteralRegex 'src/Mezhs.Agent.Api/Services/AgentWorker.cs' `
            '                execution\.Environment\);\s*_store\.ValidateAgentChatRunnable\(chatId\);' `
            ("                execution.Environment);`n            execution.ChatId = chatId;`n            _store.ValidateAgentChatRunnable(chatId);")

          $architecture = Get-Content -LiteralPath 'tests/agent-architecture.ps1' -Raw
          $anchor = 'Assert ($store -match ''TryCreateRootExecution'' -and $store -match ''TryClaimNextQueuedExecution'' -and $store -match ''RETURNING \*'') "SQLite is not the authoritative admission/claim owner for root Agent executions."'
          $assertion = 'Assert ($store -match ''ClaimAgentChat\(\s*string executionId'' -and $store -match ''attach\.Transaction = transaction'' -and $store -notmatch ''public void AttachChat'') "Agent chat ownership and execution chat attachment are not published atomically."'
          if (-not $architecture.Contains($anchor)) { throw 'Could not locate AgentStore architecture assertion anchor.' }
          $architecture = $architecture.Replace($anchor, $anchor + "`n" + $assertion)
          Write-Utf8 'tests/agent-architecture.ps1' $architecture

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Publish Agent chat ownership atomically [skip ci]"
          git push
