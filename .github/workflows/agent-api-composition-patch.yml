name: agent-api-composition-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Format composition cleanup'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact([string]$path, [string]$old, [string]$new) {
            $text = Get-Content -LiteralPath $path -Raw
            if (-not $text.Contains($old)) { throw "Expected text not found in $path" }
            [IO.File]::WriteAllText((Resolve-Path $path), $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
          }

          $old = @'
useEffect(() => {
  void (async () => {
    try {
      const [policyValues, chatValues] = await Promise.all([
        api<AgentPolicy[]>("/v1/policies"),
        api<AgentChat[]>("/v1/agent-chats"),
      ]);
      setApiReady(true);
      setPolicies(policyValues);
      setChats(chatValues);
      setPolicyId(policyValues[0]?.id ?? "");
      if (chatValues.length > 0)
        setSelectedChatId(chatValues[0].chatId);
    } catch (error) {
      setApiReady(false);
      setNotice(error instanceof Error ? error.message : "Could not load MEŽS Agent.");
    }
  })();
}, []);
'@
          $new = @'
  useEffect(() => {
    void (async () => {
      try {
        const [policyValues, chatValues] = await Promise.all([
          api<AgentPolicy[]>("/v1/policies"),
          api<AgentChat[]>("/v1/agent-chats"),
        ]);
        setApiReady(true);
        setPolicies(policyValues);
        setChats(chatValues);
        setPolicyId(policyValues[0]?.id ?? "");
        if (chatValues.length > 0)
          setSelectedChatId(chatValues[0].chatId);
      } catch (error) {
        setApiReady(false);
        setNotice(error instanceof Error ? error.message : "Could not load MEŽS Agent.");
      }
    })();
  }, []);
'@
          Replace-Exact 'src/Mezhs.Agent.Web/src/App.tsx' $old $new

          $old = @'
async function refreshChats() {
  try {
    setChats(await api<AgentChat[]>("/v1/agent-chats"));
    setApiReady(true);
  } catch {
    setApiReady(false);
    // Keep the last durable view during transient refresh failures.
  }
}
'@
          $new = @'
  async function refreshChats() {
    try {
      setChats(await api<AgentChat[]>("/v1/agent-chats"));
      setApiReady(true);
    } catch {
      setApiReady(false);
      // Keep the last durable view during transient refresh failures.
    }
  }
'@
          Replace-Exact 'src/Mezhs.Agent.Web/src/App.tsx' $old $new

          $old = @'
        while (true)
        {
  var message = Get(messageId)
      ?? throw new ResourceNotFoundException($"Message '{messageId}' was not found.");

  switch (message.Status)
  {
      case MessageStatus.Completed:
          return message.Reply
              ?? throw new InvalidOperationException("MEŽS completed without an assistant reply.");
      case MessageStatus.Failed:
      case MessageStatus.Cancelled:
          throw new InvalidOperationException(
              message.Error ?? $"MEŽS message ended with status {message.Status}.");
      default:
          await Task.Delay(TimeSpan.FromMilliseconds(250), cancellationToken);
          break;
  }
        }
    }
    protected override async Task ExecuteAsync(CancellationToken stoppingToken)
'@
          $new = @'
        while (true)
        {
            var message = Get(messageId)
                ?? throw new ResourceNotFoundException($"Message '{messageId}' was not found.");

            switch (message.Status)
            {
                case MessageStatus.Completed:
                    return message.Reply
                        ?? throw new InvalidOperationException("MEŽS completed without an assistant reply.");
                case MessageStatus.Failed:
                case MessageStatus.Cancelled:
                    throw new InvalidOperationException(
                        message.Error ?? $"MEŽS message ended with status {message.Status}.");
                default:
                    await Task.Delay(TimeSpan.FromMilliseconds(250), cancellationToken);
                    break;
            }
        }
    }

    protected override async Task ExecuteAsync(CancellationToken stoppingToken)
'@
          Replace-Exact 'src/Mezhs.Api/Services/MessageService.cs' $old $new

          $old = @'
        Messages = new AgentRuntimeMessages
        {
  Continue = "continue",
  PolicyCorrection = "policy",
  CommandCorrection = "command",
  CommandResults = "results",
  ProtocolIntro = "protocol",
  ShellContext = "shell"
        },
'@
          $new = @'
        Messages = new AgentRuntimeMessages
        {
            Continue = "continue",
            PolicyCorrection = "policy",
            CommandCorrection = "command",
            CommandResults = "results",
            ProtocolIntro = "protocol",
            ShellContext = "shell"
        },
'@
          Replace-Exact 'tests/agent-cancel-recovery.ps1' $old $new

          $smoke = Get-Content -LiteralPath 'tests/agent-api-smoke.ps1' -Raw
          $smoke = $smoke.Replace('        try {`n  if ($response.Headers.Contains("Access-Control-Allow-Origin")) {`n      throw "Agent API allowed a non-loopback browser origin."`n  }`n        } finally', '        try {`n            if ($response.Headers.Contains("Access-Control-Allow-Origin")) {`n                throw "Agent API allowed a non-loopback browser origin."`n            }`n        } finally')
          $smoke = $smoke.Replace('        try {`n  if (-not $loopbackResponse.Headers.Contains("Access-Control-Allow-Origin")) {`n      throw "Agent API did not allow a loopback browser origin."`n  }`n        } finally', '        try {`n            if (-not $loopbackResponse.Headers.Contains("Access-Control-Allow-Origin")) {`n                throw "Agent API did not allow a loopback browser origin."`n            }`n        } finally')
          $smoke = $smoke.Replace('        try {`n  $null = Invoke-RestMethod -Uri "http://127.0.0.1:5200/v1/policies"`n  break`n        } catch {`n  if ([DateTimeOffset]::UtcNow -ge $deadline) { throw }`n        }', '        try {`n            $null = Invoke-RestMethod -Uri "http://127.0.0.1:5200/v1/policies"`n            break`n        } catch {`n            if ([DateTimeOffset]::UtcNow -ge $deadline) { throw }`n        }')
          [IO.File]::WriteAllText((Resolve-Path 'tests/agent-api-smoke.ps1'), $smoke, [Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "Format Agent API composition cleanup [skip ci]"
            git push
          }
