name: agent-api-composition-patch

on:
  push:
    branches:
      - agent-api-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Normalize temporary composition patch workflow'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mechanical follow-up edits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Regex([string]$path, [string]$pattern, [string]$replacement) {
            $text = Get-Content -LiteralPath $path -Raw
            $updated = [regex]::Replace($text, $pattern, $replacement)
            if ($updated -eq $text) { throw "Expected pattern not found in $path`n$pattern" }
            [IO.File]::WriteAllText((Resolve-Path $path), $updated, [Text.UTF8Encoding]::new($false))
          }

          Replace-Regex 'src/Mezhs.Agent.Api/Persistence/AgentStore.cs' `
            'new\(options\.Storage\)' `
            'new(options.AgentStorage)'

          $newOptions = @'
          var shellOptions = new AgentOptions
          {
              Version = options.Version,
              Server = options.Server,
              Transport = options.Transport,
              Storage = options.Storage,
              Connections = options.Connections,
              AgentStorage = Path.Combine(Path.GetTempPath(), $"mezhs-agent-policy-{Guid.NewGuid():N}.sqlite"),
              Workspace = options.Workspace,
              Runtime = options.Runtime,
              Messages = options.Messages,
              Policies = options.Policies
          };
          '@.Replace('          ', '')
          Replace-Regex 'tests/policy-decoder.ps1' `
            '(?s)var shellOptions = new AgentOptions\s*\{.*?\n\};(?=\r?\nvar executorPath)' `
            $newOptions
          Replace-Regex 'tests/policy-decoder.ps1' `
            'DeleteDatabase\(shellOptions\.Storage\);' `
            'DeleteDatabase(shellOptions.AgentStorage);'

          Replace-Regex 'src/Mezhs.Agent.Web/src/App.tsx' `
            '(?s)type Runtime = \{\s*status: string;\s*mezhsApi: string;\s*mezhsApiHealthy: boolean;\s*\};' `
            "type Runtime = {`n  status: string;`n};"
          Replace-Regex 'src/Mezhs.Agent.Web/src/App.tsx' `
            '(?s)<span className=\{`health-dot \$\{runtime\?\.mezhsApiHealthy \? "online" : ""\}`\}\s*title=\{runtime\?\.mezhsApiHealthy \? "MEŽS API online" : "MEŽS API unavailable"\} />' `
            '<span className={`health-dot ${runtime?.status === "ok" ? "online" : ""}`} title={runtime?.status === "ok" ? "MEŽS Agent API online" : "MEŽS Agent API unavailable"} />'

          $newRuntimeCheck = @'
              $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:5199/v1/runtime"
              if ($runtime.status -ne "ok") { throw "Agent API runtime is not healthy." }
              $agentConnections = @(Invoke-RestMethod -Uri "http://127.0.0.1:5199/v1/connections")
              if (-not ($agentConnections | Where-Object { $_.id -eq "test" })) {
                  throw "Agent API does not expose the shared MEŽS API surface."
              }
          '@.Replace('          ', '')
          Replace-Regex 'tests/agent-api-smoke.ps1' `
            '(?m)^    \$runtime = Invoke-RestMethod -Uri "http://127\.0\.0\.1:5199/v1/runtime"\r?\n    if \(-not \$runtime\.mezhsApiHealthy\) \{ throw "Agent API cannot reach generic MEZS API\." \}' `
            $newRuntimeCheck

          Replace-Regex 'tests/architecture.ps1' `
            '\$program = Get-Content \(Join-Path \$root "src/Mezhs\.Api/Program\.cs"\) -Raw' `
            ('$program = Get-Content (Join-Path $root "src/Mezhs.Api/Program.cs") -Raw' + "`n" + '$apiComposition = Get-Content (Join-Path $root "src/Mezhs.Api/MezhsApi.cs") -Raw')
          $newMiddleware = @'
          if ($apiComposition -notmatch 'AddExceptionHandler<ApiExceptionHandler>' -or
              $apiComposition -notmatch 'AddProblemDetails' -or
              $apiComposition -notmatch 'UseExceptionHandler') {
              throw "The reusable API composition does not own exception middleware."
          }
          if ($program -notmatch 'AddMezhsApi' -or $program -notmatch 'UseMezhsApi' -or $program -notmatch 'MapMezhsApi') {
              throw "Mezhs.Api is not a thin host over the reusable API composition."
          }
          '@.Replace('          ', '')
          Replace-Regex 'tests/architecture.ps1' `
            '(?s)if \(\$program -notmatch ''AddExceptionHandler<ApiExceptionHandler>''.*?throw "The API exception handler is not registered as middleware\."\s*\}' `
            $newMiddleware

          Replace-Regex 'tests/agent-architecture.ps1' `
            'Assert \(\$config -match ''RequiredLoopbackHttpUri'' -and \$config -match ''uri\\\.IsLoopback''\) "Host-shell Agent API is not restricted to loopback binding\."' `
            'Assert ($options -match '': MezhsOptions'' -and $config -match ''MezhsConfigLoader\.Load<AgentOptions>'' -and $config -match ''options\.Server\.Listen'' -and $config -match ''listen\.IsLoopback'') "Agent configuration does not extend core MEŽS configuration while enforcing loopback binding."'
          Replace-Regex 'tests/agent-architecture.ps1' `
            '\$agentClient = Read "src/Mezhs\.Agent\.Api\.Client/AgentApiClient\.cs"' `
            ('$agentClient = Read "src/Mezhs.Agent.Api.Client/AgentApiClient.cs"' + "`n" + '$agentProject = Read "src/Mezhs.Agent.Api/Mezhs.Agent.Api.csproj"' + "`n" + '$coreComposition = Read "src/Mezhs.Api/MezhsApi.cs"')
          $newAgentAssertions = @'
          Assert ($program -notmatch 'AllowAnyOrigin|AllowAnyHeader|AllowAnyMethod|AddCors|UseCors') "Agent API still exposes permissive CORS."
          Assert ($program -match 'AddMezhsApi\(options\)' -and $program -match 'UseMezhsApi\(\)' -and $program -match 'MapMezhsApi\(\)') "Agent API is not composed from the reusable MEŽS API foundation."
          Assert ($agentProject -match 'Mezhs\.Api\\Mezhs\.Api\.csproj' -and $agentProject -notmatch 'Mezhs\.Api\.Client') "Agent API still consumes the normal API through its HTTP client project."
          Assert ($worker -match 'ChatService' -and $worker -match 'MessageService' -and $worker -notmatch 'MezhsApiClient') "Agent worker still crosses an HTTP boundary instead of using core services directly."
          Assert ($agentClient -match ': MezhsApiClient') "Agent API client is not the normal MEŽS client plus Agent-specific operations."
          Assert ($coreComposition -match 'MapMezhsApi' -and $coreComposition -match 'AddMezhsApi' -and $coreComposition -match 'UseMezhsApi') "Reusable MEŽS API composition is incomplete."
          '@.Replace('          ', '')
          Replace-Regex 'tests/agent-architecture.ps1' `
            'Assert \(\$program -notmatch ''AllowAnyOrigin\|AllowAnyHeader\|AllowAnyMethod\|AddCors\|UseCors''\) "Agent API still exposes permissive CORS\."' `
            $newAgentAssertions

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Complete Agent API composition refactor [skip ci]"
          git push
