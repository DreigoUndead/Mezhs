name: Common Solution Cleanup

on:
  push:
    branches:
      - executor-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore minimal solution and add Common
        shell: pwsh
        run: |
          git checkout 6ea5924fbebf64087895f364414175f065b0e9a3 -- Mezhs.sln
          @'
          from pathlib import Path

          path = Path("Mezhs.sln")
          text = path.read_text(encoding="utf-8")
          project = 'Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "Mezhs.Common", "src\\Mezhs.Common\\Mezhs.Common.csproj", "{098C4223-1AC5-4F37-A476-D1664223C2B1}"\nEndProject\n'
          text = text.replace("\nGlobal\n", "\n" + project + "Global\n", 1)
          configs = (
              '\t\t{098C4223-1AC5-4F37-A476-D1664223C2B1}.Debug|Any CPU.ActiveCfg = Debug|Any CPU\n'
              '\t\t{098C4223-1AC5-4F37-A476-D1664223C2B1}.Debug|Any CPU.Build.0 = Debug|Any CPU\n'
              '\t\t{098C4223-1AC5-4F37-A476-D1664223C2B1}.Release|Any CPU.ActiveCfg = Release|Any CPU\n'
              '\t\t{098C4223-1AC5-4F37-A476-D1664223C2B1}.Release|Any CPU.Build.0 = Release|Any CPU\n'
          )
          marker = "\tEndGlobalSection\n\tGlobalSection(SolutionProperties) = preSolution"
          text = text.replace(marker, configs + marker, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path rewrite_solution.py -Encoding utf8
          python rewrite_solution.py
          Remove-Item rewrite_solution.py
          $diff = (git diff --numstat -- Mezhs.sln).Trim()
          if ($diff -ne "6`t0`tMezhs.sln") { throw "Unexpected solution diff: $diff" }
      - name: Build solution
        run: dotnet build Mezhs.sln -c Release --nologo
      - name: Common regression suite
        run: dotnet run --project tests/Mezhs.Common.TestApp/Mezhs.Common.TestApp.csproj -c Release
      - name: Console regression suite
        run: dotnet run --project tests/Mezhs.Console.TestApp/Mezhs.Console.TestApp.csproj -c Release -- Test
      - name: Executor self-test
        run: dotnet run --project src/Mezhs.Executor/Mezhs.Executor.csproj -c Release --no-build -- Test
      - name: Persist minimal solution
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mezhs.sln
          git commit -m "Keep Mezhs.Common solution change minimal [skip ci]"
          git push
