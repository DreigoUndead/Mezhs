name: Temporary Agent gap fix

on:
  push:
    branches:
      - agent-api-foundation

permissions:
  contents: write

concurrency:
  group: temporary-agent-gap-fix
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-api-foundation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply audited fixes
        shell: bash
        run: |
          git show 70d2003d8da9a32aa23475e75be4e0436bddc7bc:.github/workflows/agent-fix-temp.yml | awk '
            $0 == "          python - <<\x27PY\x27" { in_script=1; next }
            $0 == "          PY" { in_script=0; exit }
            in_script { if (substr($0,1,10)=="          ") print substr($0,11); else print $0 }
          ' > .agent-fix-temp.py
          set +e
          python .agent-fix-temp.py > .agent-fix-log.txt 2>&1
          status=$?
          set -e
          cat .agent-fix-log.txt
          rm .agent-fix-temp.py
          exit $status

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-fix-diagnostics
          path: .agent-fix-log.txt
          if-no-files-found: error

      - name: Build solution
        run: dotnet build Mezhs.sln -c Release
      - name: Agent architecture
        shell: pwsh
        run: ./tests/agent-architecture.ps1
      - name: Shared Agent UI
        shell: pwsh
        run: ./tests/agent-web-shared-ui.ps1
      - name: Policy, queue, shell, and protocol behavior
        shell: pwsh
        run: ./tests/policy-decoder.ps1
      - name: Agent API smoke
        shell: pwsh
        run: ./tests/agent-api-smoke.ps1
      - name: Agent runtime resilience
        shell: pwsh
        run: ./tests/agent-runtime-resilience.ps1

      - name: Commit validated fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENT_API_TODO.md TODO.md agent.yaml tests src
          if (git diff --cached --quiet) { throw "Fix workflow produced no changes." }
          git commit -m "Fix audited Agent protocol and lifecycle gaps [skip ci]"
          git push origin HEAD:agent-api-foundation
