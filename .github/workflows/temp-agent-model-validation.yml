name: Temporary Agent model validation

on:
  push:
    branches:
      - agent-model-presets

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release
      - name: Browser provider model tests
        shell: pwsh
        run: node --test tests/browser-provider-operations.test.js tests/chatgpt-account-api.test.js
      - name: Shared API smoke
        shell: pwsh
        run: ./tests/api-smoke.ps1
      - name: Agent policy/config tests
        shell: pwsh
        run: ./tests/policy-decoder.ps1
      - name: Agent store migration
        shell: pwsh
        run: ./tests/agent-store-migration.ps1
      - name: Agent architecture
        shell: pwsh
        run: ./tests/agent-architecture.ps1
      - name: Agent provider lifetime
        shell: pwsh
        run: ./tests/agent-provider-lifetime.ps1
      - name: Agent shared UI
        shell: pwsh
        run: ./tests/agent-web-shared-ui.ps1
      - name: Agent API smoke
        shell: pwsh
        run: ./tests/agent-api-smoke.ps1
