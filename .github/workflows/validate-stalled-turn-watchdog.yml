name: Temporary stalled turn watchdog validation

on:
  push:
    branches:
      - fix-stalled-turn-watchdog

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run validation
        shell: bash
        run: |
          set +e
          : > validation-output.txt

          echo "=== dotnet build Mezhs.sln -c Release ===" >> validation-output.txt
          dotnet build Mezhs.sln -c Release >> validation-output.txt 2>&1
          build_exit=$?

          echo "" >> validation-output.txt
          echo "=== node --test targeted ChatGPT integration tests ===" >> validation-output.txt
          node --test tests/chatgpt-account-api.test.js tests/browser-provider-operations.test.js >> validation-output.txt 2>&1
          test_exit=$?

          {
            echo "branch: fix-stalled-turn-watchdog"
            echo "commit: $GITHUB_SHA"
            echo "dotnet_build_exit: $build_exit"
            echo "node_tests_exit: $test_exit"
            if [ "$build_exit" -eq 0 ] && [ "$test_exit" -eq 0 ]; then
              echo "overall: PASS"
            else
              echo "overall: FAIL"
            fi
            echo ""
            cat validation-output.txt
          } > .stalled-turn-watchdog-validation.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stalled-turn-watchdog-validation.txt
          git commit -m "Record stalled turn watchdog validation [skip ci]" || true
          git push

          if [ "$build_exit" -ne 0 ] || [ "$test_exit" -ne 0 ]; then
            exit 1
          fi
