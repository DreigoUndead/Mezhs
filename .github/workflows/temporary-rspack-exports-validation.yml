name: Temporary Rspack export diagnostics validation

on:
  push:
    branches: [agent-model-presets]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Node tests and .NET build
        shell: bash
        run: |
          set +e
          node --check electron/main.js > rspack-exports-validation.txt 2>&1
          check=$?
          node --test tests/*.test.js >> rspack-exports-validation.txt 2>&1
          tests=$?
          dotnet build Mezhs.sln -c Release --nologo >> rspack-exports-validation.txt 2>&1
          build=$?
          printf '\nCHECK=%s TESTS=%s BUILD=%s\n' "$check" "$tests" "$build" >> rspack-exports-validation.txt
          if [ "$check" -eq 0 ] && [ "$tests" -eq 0 ] && [ "$build" -eq 0 ]; then
            echo 'OVERALL=PASS' >> rspack-exports-validation.txt
          else
            echo 'OVERALL=FAIL' >> rspack-exports-validation.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rspack-exports-validation.txt
          git commit -m 'Record temporary Rspack exports validation [skip ci]'
          git push
          exit 0