name: Validate agent model presets

on:
  push:
    branches:
      - agent-model-presets

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-model-presets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run focused tests and build
        shell: bash
        run: |
          set +e
          result_file=".agent-model-presets-validation.txt"
          : > "$result_file"

          echo "== Node provider tests ==" >> "$result_file"
          node --test tests/chatgpt-account-api.test.js tests/browser-provider-operations.test.js >> "$result_file" 2>&1
          node_exit=$?
          echo "NODE_EXIT=$node_exit" >> "$result_file"
          echo >> "$result_file"

          echo "== Solution build ==" >> "$result_file"
          dotnet build Mezhs.sln --configuration Release >> "$result_file" 2>&1
          build_exit=$?
          echo "BUILD_EXIT=$build_exit" >> "$result_file"
          echo >> "$result_file"

          if [ "$node_exit" -eq 0 ] && [ "$build_exit" -eq 0 ]; then
            echo "OVERALL=PASS" >> "$result_file"
          else
            echo "OVERALL=FAIL" >> "$result_file"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_file"
          git commit -m "Record agent-model-presets validation [skip ci]" || true
          git push
