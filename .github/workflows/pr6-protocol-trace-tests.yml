name: PR 6 protocol trace tests

on:
  push:
    branches:
      - agent/prefer-api-over-dom

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck ChatGPT browser module
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npx --yes -p typescript@5.9.2 tsc -p integrations/Mezhs.Integrations.ChatGpt/browser/tsconfig.json
      - name: Provider operation tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --test tests/browser-provider-operations.test.js
