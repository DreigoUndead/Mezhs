name: Log foundation validation

on:
  push:
    branches: [log-foundation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: log-foundation
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate
        shell: pwsh
        run: |
          $lines = @()

          dotnet build Mezhs.sln -c Release 2>&1 | Tee-Object -Variable buildOutput
          $build = $LASTEXITCODE
          $lines += "BUILD_EXIT_CODE: $build"
          $lines += $buildOutput

          dotnet run --project tests/Mezhs.Console.TestApp -c Release -- Test 2>&1 | Tee-Object -Variable consoleOutput
          $console = $LASTEXITCODE
          $lines += "CONSOLE_TEST_EXIT_CODE: $console"
          $lines += $consoleOutput

          dotnet run --project tests/Mezhs.Log.TestApp -c Release -- Test 2>&1 | Tee-Object -Variable logOutput
          $logs = $LASTEXITCODE
          $lines += "LOG_TEST_EXIT_CODE: $logs"
          $lines += $logOutput

          $overall = if ($build -eq 0 -and $console -eq 0 -and $logs -eq 0) { "PASS" } else { "FAIL" }
          @("OVERALL: $overall") + $lines | Set-Content .log-foundation-validation-result.txt
      - name: Publish validation result
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .log-foundation-validation-result.txt
          git commit -m "record log foundation validation [skip ci]" 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
