name: Temporary Agent shared UI validation

on:
  push:
    branches:
      - agent-api-foundation

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release
      - name: Shared Agent UI
        shell: pwsh
        run: pwsh ./tests/agent-web-shared-ui.ps1
      - name: Agent API and Web smoke
        shell: pwsh
        run: pwsh ./tests/agent-api-smoke.ps1
