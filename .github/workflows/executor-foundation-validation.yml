name: Executor foundation validation

on:
  push:
    branches: [executor-foundation]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release --nologo
      - name: Console regression suite
        shell: pwsh
        run: dotnet run --project tests/Mezhs.Console.TestApp/Mezhs.Console.TestApp.csproj -c Release -- Test
      - name: Executor lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executor = (Resolve-Path 'src/Mezhs.Executor/bin/Release/net10.0/Mezhs.Executor.dll').Path
          $data = Join-Path $PWD 'data/executor-validation.sqlite'
          Remove-Item $data,"$data-shm","$data-wal" -Force -ErrorAction SilentlyContinue
          $env:MEZHS_EXECUTOR_STORAGE = $data
          $env:MEZHS_EXECUTION_ID = 'validation-parent'
          $env:MEZHS_SOURCE = 'github-actions'
          $work = Join-Path $PWD 'executor-validation-work'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $work -ItemType Directory | Out-Null

          function Executor([Parameter(ValueFromRemainingArguments=$true)][string[]]$a) {
            $o = & dotnet $executor @a 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Executor $($a -join ' ') failed: $($o -join [Environment]::NewLine)" }
            return ($o -join [Environment]::NewLine).Trim()
          }
          function Status([string]$r) { ([regex]::Match($r,'(?m)^Status:\s+(\w+)\s*$')).Groups[1].Value }
          function Field([string]$r,[string]$n) { ([regex]::Match($r,"(?m)^$([regex]::Escape($n)):\s+([^\r\n]+)\s*$")).Groups[1].Value.Trim() }
          function Assert([bool]$c,[string]$m) { if (-not $c) { throw $m } }
          $sleep20 = 'powershell -NoProfile -Command "Start-Sleep -Seconds 20"'
          $sleep30 = 'powershell -NoProfile -Command "Start-Sleep -Seconds 30"'

          $f=Join-Path $work 'survived.txt'
          $id=[int](Executor Execute "ping -n 3 127.0.0.1 >nul & echo survived>$f" $work 30)
          $r=Executor Wait $id 20
          Assert ((Status $r)-eq 'Completed') "Detached caller exit: got $(Status $r)"
          Assert (Test-Path $f) 'Detached caller exit: side effect missing'

          $f=Join-Path $work 'atomic.txt'
          $id=[int](Executor Execute "ping -n 3 127.0.0.1 >nul & echo hit>>$f" $work 30)
          $p1=Start-Process dotnet -ArgumentList @($executor,'Run',$id) -PassThru -WindowStyle Hidden
          $p2=Start-Process dotnet -ArgumentList @($executor,'Run',$id) -PassThru -WindowStyle Hidden
          $r=Executor Wait $id 20
          $p1.WaitForExit(5000)|Out-Null
          $p2.WaitForExit(5000)|Out-Null
          Assert ((Status $r)-eq 'Completed') "Atomic claim: got $(Status $r)"
          Assert (@(Get-Content $f).Count -eq 1) 'Atomic claim: side effect duplicated'

          $id=[int](Executor Execute $sleep20 $work 30)
          Start-Sleep -Milliseconds 1200
          $before=Executor Get $id
          Write-Host "Kill before:`n$before"
          $kill=Executor Kill $id
          Write-Host "Kill response:`n$kill"
          Assert ((Status $kill)-in @('KillRequested','Killed')) "Kill request transition: got $(Status $kill)"
          Start-Sleep -Seconds 2
          $after=Executor Get $id
          Write-Host "Kill after 2s:`n$after"
          $r=Executor Wait $id 15
          Assert ((Status $r)-eq 'Killed') "Kill: got $(Status $r)"

          $id=[int](Executor Execute $sleep20 $work 1)
          $r=Executor Wait $id 15
          Assert ((Status $r)-eq 'TimedOut') "Timeout: got $(Status $r)"

          $f=Join-Path $work 'restart.txt'
          $id=[int](Executor Execute "powershell -NoProfile -Command \"Start-Sleep -Seconds 8\" & echo done>>$f" $work 30)
          Start-Sleep -Milliseconds 1200
          $new=[int](Executor Restart $id)
          Assert ($new-ne$id) 'Restart: ID reused'
          $replacement=Executor Wait $new 25
          $old=Executor Get $id
          Assert ((Status $replacement)-eq 'Completed') "Restart replacement: got $(Status $replacement)"
          Assert ((Field $replacement 'RestartedFromId')-eq "$id") 'Restart: new lineage missing'
          Assert ((Field $old 'RestartedAsId')-eq "$new") 'Restart: old lineage missing'
          Assert (@(Get-Content $f).Count -eq 1) 'Restart: old child reached side effect'

          $env:MEZHS_CHAT_ID='validation-chat'
          $env:MEZHS_TRIGGER_MESSAGE_ID='validation-message'
          $env:MEZHS_COMMAND_INDEX='0'
          $f=Join-Path $work 'once.txt'
          $id1=[int](Executor Execute "ping -n 3 127.0.0.1 >nul & echo once>>$f" $work 30)
          $id2=[int](Executor Execute "ping -n 3 127.0.0.1 >nul & echo once>>$f" $work 30)
          Assert ($id1-eq$id2) 'Agent correlation: ID changed'
          $r=Executor Wait $id1 20
          Assert ((Status $r)-eq 'Completed') "Agent correlation: got $(Status $r)"
          Assert (@(Get-Content $f).Count -eq 1) 'Agent correlation: side effect duplicated'
          Remove-Item Env:MEZHS_CHAT_ID,Env:MEZHS_TRIGGER_MESSAGE_ID,Env:MEZHS_COMMAND_INDEX -ErrorAction SilentlyContinue

          $id=[int](Executor Execute $sleep30 $work 60)
          Start-Sleep -Milliseconds 1200
          $running=Executor Get $id
          $owner=[int](Field $running 'OwnerProcessId')
          $child=[int](Field $running 'ProcessId')
          Stop-Process -Id $owner -Force
          Start-Sleep -Seconds 10
          $dead=Executor Get $id
          Assert ((Status $dead)-eq 'Dead') "Dead reconciliation: got $(Status $dead)"
          Stop-Process -Id $child -Force -ErrorAction SilentlyContinue

          $matches = Get-ChildItem src/Mezhs.Agent.Api -Filter *.cs -Recurse | Select-String -Pattern 'ProcessStartInfo|Process\.Start\('
          Assert ($matches.Count -eq 0) ("Direct Agent shell process API remains: " + ($matches -join '; '))
