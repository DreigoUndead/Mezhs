name: Validate ChatGPT account API refactor

on:
  push:
    branches:
      - fix-chatgpt-composer-selection

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Node tests
        shell: pwsh
        run: node --test tests/*.test.js
      - name: Provider lifetime architecture test
        shell: pwsh
        run: ./tests/agent-provider-lifetime.ps1
      - name: Build solution
        shell: pwsh
        run: dotnet build Mezhs.sln -c Release
