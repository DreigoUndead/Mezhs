version: 1

server:
  listen: http://127.0.0.1:5050

transport:
  type: electron
  idleMinutes: 15
  electronDirectory: electron

storage:
  root: data

connections:
  - id: chatgpt-sub
    name: ChatGPT Account
    integration: chatgpt-web-account
    workspace: Mezhs
    # Explicitly enable two simultaneous local model turns on this account.
    # Omitted limits default to maxParallel: 1 and spacing: 0.
    limits:
      maxParallel: 2
      minIntervalBetweenStartsMs: 0

  - id: chatgpt-guest
    name: ChatGPT Guest
    integration: chatgpt-web

  - id: gemini-guest
    name: Gemini Guest
    integration: gemini-web

  - id: grok-account
    name: Grok Account
    integration: grok-web-account
