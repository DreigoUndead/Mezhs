version: 1

server:
  listen: http://127.0.0.1:5050

transport:
  type: electron
  idleMinutes: 15
  electronDirectory: electron

storage:
  root: data

connections:
  - id: chatgpt-account
    name: ChatGPT Account
    integration: chatgpt-web-account

  - id: chatgpt-guest
    name: ChatGPT Guest
    integration: chatgpt-web

  - id: gemini-guest
    name: Gemini Guest
    integration: gemini-web
