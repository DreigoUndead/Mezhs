version: 1

server:
  listen: http://127.0.0.1:5199

transport:
  type: electron
  idleMinutes: 1
  electronDirectory: ../electron

storage:
  root: data-agent-test/core

connections:
  - id: test
    name: Deterministic test integration
    integration: mock
    defaultModel: mock-fast

  - id: test-alt
    name: Alternate deterministic integration
    integration: mock
    defaultModel: mock-deep

  - id: test-login
    name: Deterministic login integration
    integration: mock-login

agentStorage: data-agent-test/agent.sqlite
workspace: ..

runtime:
  queueCapacity: 1
  maxConcurrentExecutions: 1

messages:
  continue: |
    Continue the assigned deterministic test task.
  policyCorrection: |
    Policy rejected your completion claim:
    {error}

    Continue the assigned task and correct the policy violation.
  commandCorrection: |
    MEŽS rejected an agent command:
    {error}

    Correct the command or continue without it.
  commandResults: |
    MEŽS runtime command results follow.
    Separate observed facts from hypotheses. A change that fixes a symptom does not by itself prove the original cause; state causality as established only when the evidence distinguishes it from plausible alternatives.

    Command results JSON:
    {json}

    Continue the assigned deterministic test task.
  protocolIntro: |
    Agent command protocol:
    - Only use commands allowed by policy.
    - Execution history is evidence.
    - Separate observed facts from hypotheses. Do not present a suspected cause as established unless the available evidence distinguishes it from plausible alternatives.
  shellContext: |
    Host shell: {shell}
    Each executable agent command has a timeout of {timeout} seconds.

policies:
  low:
    connectionId: test
    defaultModel: mock-fast
    instructions: Complete the assigned deterministic test task.
    commands:
      allow: [SH]
    environment:
      allow: [TEST_AGENT_VALUE]
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 2

  mid:
    connectionId: test
    defaultModel: mock-deep
    instructions: Complete the assigned deterministic test task.
    commands:
      allow: [SH]
    environment:
      allow: [TEST_AGENT_VALUE]
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 2

  high:
    connectionId: test-alt
    defaultModel: mock-deep
    instructions: Complete the assigned deterministic test task.
    commands:
      allow: [SH]
    environment:
      allow: [TEST_AGENT_VALUE]
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 2

  test:
    connectionId: test
    instructions: Complete the assigned deterministic test task.
    commands:
      allow: [SH]
    environment:
      allow: [TEST_AGENT_VALUE]
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 2
  test-alt:
    connectionId: test
    instructions: Alternative deterministic policy for ownership validation.
    commands:
      allow: []
    environment:
      allow: []
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 2

  test-done:
    connectionId: test
    instructions: This policy requires an explicit completion claim.
    commands:
      allow: []
    environment:
      allow: []
    completion:
      requireDone: true
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 2

  test-evidence:
    connectionId: test
    instructions: Completion requires successful shell evidence.
    commands:
      allow: [SH]
    environment:
      allow: []
    completion:
      requireDone: true
      requiredSuccessfulCommands: [SH]
    limits:
      commandTimeoutSeconds: 2

  test-evidence-auto:
    connectionId: test
    instructions: Completion is automatic after successful shell evidence exists.
    commands:
      allow: [SH]
    environment:
      allow: []
    completion:
      requireDone: false
      requiredSuccessfulCommands: [SH]
    limits:
      commandTimeoutSeconds: 2

  test-timeout:
    connectionId: test
    instructions: Exercise shell timeout behavior.
    commands:
      allow: [SH]
    environment:
      allow: []
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 1

  test-cancel:
    connectionId: test
    instructions: Exercise cancellation and queue behavior.
    commands:
      allow: [SH]
    environment:
      allow: []
    completion:
      requireDone: false
      requiredSuccessfulCommands: []
    limits:
      commandTimeoutSeconds: 30
